[project]
name = "kingphisher-phoenix-platform"
version = "0.1.0"
description = "Kingphisher-Phoenix: threat-informed phishing training and assessment platform"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # Runtime clients and their tests still use the stable httpx API.
    "httpx2>=2.0",  # Starlette 1.3+ TestClient uses httpx2; keep this test-only.
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]
exclude = [
    "apps/operator-ui",
]

[tool.uv.sources]
kp-domain-models = { workspace = true }
kp-contracts = { workspace = true }
kp-auditing = { workspace = true }
kp-authorization = { workspace = true }
kp-telemetry = { workspace = true }
kp-sanitization = { workspace = true }
kp-database = { workspace = true }
kp-safety-validation = { workspace = true }
kp-ai-gateway = { workspace = true }
kp-source-adapters = { workspace = true }
kp-campaign-patterns = { workspace = true }
kp-test-fixtures = { workspace = true }
kp-templating = { workspace = true }
kp-domain-verification = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"
# `.claude/worktrees/` holds throwaway agent worktrees — full checkouts of other
# revisions of this same repo. They are untracked, so CI never sees them, but
# locally they made `make lint` report errors from stale copies of files that are
# already fixed on main. Excluding them keeps the local gate honest to CI.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S113", "B008"]
"**/tests/**" = ["S105", "S106", "S113", "B008"]
"apps/**/src/**" = ["B008"]  # FastAPI Depends() defaults are the framework idiom
"packages/**/src/**/config.py" = ["S106"]  # dev-only DB defaults in the local stack
# DDL migrations must interpolate identifiers (table/constraint names): PostgreSQL
# cannot bind an identifier as a parameter. Every interpolated value in these files
# is a literal written into the migration, never input, so S608 has no reachable
# injection path here. Application query code is NOT exempt.
"packages/database/alembic/versions/**" = ["S608"]
# Dev-only IdP provisioning tool: the default is the documented password for the
# throwaway LOCAL test users it creates (never a production credential).
"infrastructure/idp/provision_idp.py" = ["S107"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# infrastructure/mock-services ships the offline AI and IdP stand-ins that the
# generation pipeline is developed against; their tests belong in the gate.
testpaths = ["packages", "apps", "tests", "infrastructure"]
addopts = "-q --strict-markers"
markers = [
    "contract: contract tests (queue round-trips against live local infra)",
    "postgres: integration tests that require a migrated PostgreSQL test database",
    "redis: integration tests that require a reachable disposable Redis instance",
    "e2e: end-to-end tests against a running local stack",
    "azure_live: opt-in read-only checks against an authenticated Azure subscription",
    "console_ui: deterministic checks for the operator console SPA (CSP, assets, and the node behavioral harness)",
    "macos_only: controller-side recovery tooling that requires macOS (Keychain, /private/tmp); deselected off Darwin",
    "requires_zsh: needs a zsh interpreter; deselected where zsh is unavailable",
    "requires_node: needs a node interpreter; deselected where node is unavailable",
    "requires_esbuild: needs the operator-ui esbuild toolchain; deselected where it is not installed",
]
