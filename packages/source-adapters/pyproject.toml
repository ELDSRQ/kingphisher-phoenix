[project]
name = "kp-source-adapters"
version = "0.1.0"
description = "Adapters for allowlisted security-advisory and threat-intel sources"
requires-python = ">=3.13"
dependencies = [
    "kp-domain-models",
    "kp-sanitization",
    "kp-contracts",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_source_adapters"]
