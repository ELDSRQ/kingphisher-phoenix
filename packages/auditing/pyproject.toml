[project]
name = "kp-auditing"
version = "0.1.0"
description = "Append-only hash-chained audit for Kingphisher-Phoenix"
requires-python = ">=3.13"
dependencies = [
    "kp-domain-models",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_auditing"]
