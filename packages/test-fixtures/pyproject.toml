[project]
name = "kp-test-fixtures"
version = "0.1.0"
description = "Deterministic fixture builders and mock-service clients for tests and local seed"
requires-python = ">=3.13"
dependencies = [
    "kp-domain-models",
    "kp-contracts",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_test_fixtures"]
