[project]
name = "kp-domain-models"
version = "0.1.0"
description = "Domain models for Kingphisher-Phoenix"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_domain_models"]
