[project]
name = "kp-campaign-patterns"
version = "0.1.0"
description = "Deterministic campaign-pattern candidate builder from sanitized source items"
requires-python = ">=3.13"
dependencies = [
    "kp-domain-models",
    "kp-contracts",
    "kp-auditing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_campaign_patterns"]
