[project]
name = "kp-telemetry"
version = "0.1.0"
description = "Structured logging, redaction, and error taxonomy for Kingphisher-Phoenix"
requires-python = ">=3.13"
dependencies = ["structlog>=24.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_telemetry"]
