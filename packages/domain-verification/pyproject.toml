[project]
name = "kp-domain-verification"
version = "0.1.0"
description = "DNS-challenge domain ownership verification (target and sending domains)"
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_domain_verification"]
