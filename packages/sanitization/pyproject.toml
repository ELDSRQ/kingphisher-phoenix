[project]
name = "kp-sanitization"
version = "0.1.0"
description = "Secure content fetching and sanitization for Kingphisher-Phoenix"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_sanitization"]
