[project]
name = "kp-database"
version = "0.1.0"
description = "Database models, session, and audit store for Kingphisher-Phoenix"
requires-python = ">=3.13"
dependencies = [
    "kp-domain-models",
    "kp-auditing",
    "kp-telemetry",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_database"]
