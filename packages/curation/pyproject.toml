[project]
name = "kp-curation"
version = "0.1.0"
description = "Pure phish-cloning and forward-a-phish curation logic, shared by the operator API and workers"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "kp-contracts",
    "kp-sanitization",
    "kp-database",
    "kp-domain-models",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_curation"]
