name: CI

# Continuous integration for every pull request and every push to main
# (OPS-002). The manually-dispatched Azure deployment workflow runs the full
# release qualification; this workflow is the always-on gate that keeps the
# hermetic suite, the type/lint checks, the dependency lock and the
# PostgreSQL/Redis integration contracts green on the default branch.
#
# NOTE FOR REPO ADMINS: `main` must be marked protected with this workflow's
# "hermetic" and "integration" jobs as required status checks. Branch
# protection is a GitHub repository setting and is intentionally NOT configured
# from here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hermetic:
    name: Hermetic lint, type, and no-skip test gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Provide the interpreter pinned by .python-version so the uv sync below
      # can resolve it with downloads disabled (UV_PYTHON_DOWNLOADS=never).
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
      - name: Install the workspace with the frozen lock
        run: UV_PYTHON_DOWNLOADS=never uv sync --frozen --all-packages
      # Node + the console dev dependencies (esbuild) must be present so the
      # console bundle-drift gate in run-hermetic-tests.sh (line 34) is exercised
      # rather than silently deselected, and so `make lint`'s node --check runs.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install console build toolchain (esbuild)
        working-directory: apps/operator-ui
        run: npm ci
      - name: Lint (ruff + console syntax check)
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Required hermetic no-skip suite
        run: make test
      - name: Verify the dependency lock is current
        run: uv lock --check

  integration:
    name: PostgreSQL and Redis integration gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Distinct application and audit roles on the disposable kingphisher_test
      # database; reserved Redis databases 14 (postgres gate) and 15 (redis
      # contract). Mirrors the Azure qualification job's service bindings.
      DATABASE_URL_TEST: postgresql+psycopg://kingphisher:kingphisher@127.0.0.1:5432/kingphisher_test
      AUDIT_DATABASE_URL_TEST: postgresql+psycopg://audit_writer:audit_writer@127.0.0.1:5432/kingphisher_test
      REDIS_URL_POSTGRES_TEST: redis://127.0.0.1:6379/14
      REDIS_URL_TEST: redis://127.0.0.1:6379/15
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: kingphisher
          POSTGRES_PASSWORD: kingphisher
          POSTGRES_DB: kingphisher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingphisher -d kingphisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
      - name: Install the workspace with the frozen lock
        run: UV_PYTHON_DOWNLOADS=never uv sync --frozen --all-packages
      # The PostgreSQL gate expects the least-privilege audit_writer role and a
      # migrated schema; create the role and run migrations before the gate
      # (mirrors the Azure qualification job's preparation step).
      - name: Prepare required database roles and schema
        env:
          DATABASE_URL: postgresql+psycopg://kingphisher:kingphisher@127.0.0.1:5432/kingphisher_test
        run: |
          uv run python -c 'import psycopg; c=psycopg.connect("postgresql://kingphisher:kingphisher@127.0.0.1:5432/kingphisher_test"); c.autocommit=True; c.execute("CREATE ROLE audit_writer LOGIN PASSWORD " + chr(39) + "audit_writer" + chr(39)); c.close()'
          make db-migrate
      - name: Required PostgreSQL integration gate
        run: make test-postgres
      - name: Required Redis integration gate
        run: make test-redis
