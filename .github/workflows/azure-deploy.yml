name: Azure deployment
run-name: ${{ inputs.deployment_request_id }}

# Two supported shapes, chosen by `network_mode`:
#
#   starter  - data-plane services stay publicly reachable, so a GitHub-hosted
#              runner can bootstrap a brand-new tenant with no pre-existing VNet
#              or self-hosted runner. For evaluation and first
#              bring-up only; Terraform refuses it for production.
#   private  - the hardened default. Postgres, Redis, Key Vault and the registry
#              sit behind private endpoints, so the deploy job must run on a
#              runner inside the VNet.
#
# Deployment images are built with `az acr build` in both modes. Before a
# workloads deployment, the qualification job also builds and starts the exact
# candidate on the hosted runner's explicitly bound Docker daemon. Azure
# Container Apps runs linux/amd64; native developer evidence is deliberately
# not interchangeable with this CI and registry qualification.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]
      network_mode:
        description: >-
          private = hardened (private endpoints, VNet runner required);
          starter = public endpoints, deployable from a hosted runner
        required: true
        default: private
        type: choice
        options: [private, starter]
      deployment_phase:
        description: Bootstrap ACS/DNS, finalize verified sender binding, or deploy workloads
        required: true
        default: foundation_bootstrap
        type: choice
        options: [foundation_bootstrap, foundation_finalize, workloads]
      deployment_config:
        description: Canonical non-secret configuration emitted by the reviewed GUI
        required: true
        type: string
      deployment_request_id:
        description: Opaque GUI deployment correlation (kp-<32 lowercase hex>-<attempt>)
        required: true
        type: string
      reviewed_commit_sha:
        description: Commit SHA resolved and reviewed by the fixed GUI deployment connector
        required: true
        type: string
      allow_email_domain_replacement:
        description: >-
          Rotate the ACS sending domain. When true, the foundation_bootstrap plan
          allowlist permits replacing ONLY the ACS email domain, its sender
          username, and its verification DNS records; every other destructive
          change stays blocked. Leave false for normal create/update bootstraps.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify source and release gates
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL_TEST: postgresql+psycopg://kingphisher:kingphisher@127.0.0.1:5432/kingphisher_test
      AUDIT_DATABASE_URL_TEST: postgresql+psycopg://audit_writer:audit_writer@127.0.0.1:5432/kingphisher_test
      REDIS_URL_POSTGRES_TEST: redis://127.0.0.1:6379/14
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: kingphisher
          POSTGRES_PASSWORD: kingphisher
          POSTGRES_DB: kingphisher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kingphisher -d kingphisher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Record runner disk headroom before qualification
        env:
          DEPLOYMENT_REQUEST_ID: ${{ inputs.deployment_request_id }}
          REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_PHASE: ${{ inputs.deployment_phase }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/qualification-evidence"
          evidence_file="$evidence_dir/checkpoints.ndjson"
          mkdir -p "$evidence_dir"
          echo "KP_QUALIFICATION_EVIDENCE_FILE=$evidence_file" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path

          request_id = os.environ["DEPLOYMENT_REQUEST_ID"]
          reviewed_commit = os.environ["REVIEWED_COMMIT_SHA"]
          environment = os.environ["DEPLOYMENT_ENVIRONMENT"]
          phase = os.environ["DEPLOYMENT_PHASE"]
          if re.fullmatch(r"kp-[0-9a-f]{32}-[1-9][0-9]{0,2}", request_id) is None:
              raise SystemExit("deployment request correlation is invalid")
          if re.fullmatch(r"[0-9a-f]{40}", reviewed_commit) is None:
              raise SystemExit("reviewed commit is invalid")
          if environment not in {"staging", "production"} or phase not in {
              "foundation_bootstrap", "foundation_finalize", "workloads"
          }:
              raise SystemExit("deployment environment or phase is invalid")

          target = Path(os.environ["RUNNER_TEMP"]) / "qualification-evidence" / "checkpoints.ndjson"
          minimum_free_bytes = 10 * 1024**3
          free_bytes = shutil.disk_usage(target.parent).free
          status = "passed" if free_bytes >= minimum_free_bytes else "blocked"
          record = {
              "schema": "kp.azure-deployment-checkpoint.v1",
              "sequence": 1,
              "recorded_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "correlation": {
                  "deployment_request_id": request_id,
                  "reviewed_commit_sha": reviewed_commit,
                  "environment": environment,
                  "phase": phase,
              },
              "workflow_run": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": "qualify",
              },
              "stage": "qualification_runner_preflight",
              "status": status,
              "evidence": {
                  "free_bytes": free_bytes,
                  "minimum_free_bytes": minimum_free_bytes,
                  "automatic_cleanup_allowed": False,
                  "mutation_performed": False,
              },
              "safe_next_action": (
                  "Continue with dependency and image qualification."
                  if status == "passed"
                  else "Use a runner with sufficient capacity; do not prune project images, caches, or evidence."
              ),
              "previous_record_sha256": None,
          }
          canonical = json.dumps(record, separators=(",", ":"), sort_keys=True)
          record["record_sha256"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          with target.open("x", encoding="utf-8") as output:
              output.write(json.dumps(record, separators=(",", ":"), sort_keys=True) + "\n")
              output.flush()
              os.fsync(output.fileno())
          if status != "passed":
              raise SystemExit("runner disk headroom is below the required 10 GiB; no cleanup was attempted")
          PY
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
      - run: uv sync --frozen --all-packages
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          # No step consumes the wrapper stdout/stderr/exitcode outputs, and the
          # wrapper merges Terraform's stderr warnings ("No outputs found" on an
          # empty pre-apply state) into stdout, tripping the output size guards.
          terraform_wrapper: false
      - name: Install pinned security scanners
        run: |
          uv tool install bandit==1.9.4
          uv tool install pip-audit==2.10.1
          uv tool install semgrep==1.171.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true
      - run: make lint
      - run: make typecheck
      - run: make security-scan
      - name: Required hermetic no-skip suite
        run: make test
      - name: Validate Terraform without a backend
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Prepare required database roles and schema
        if: inputs.deployment_phase == 'workloads'
        env:
          DATABASE_URL: postgresql+psycopg://kingphisher:kingphisher@127.0.0.1:5432/kingphisher_test
        run: |
          uv run python -c 'import psycopg; c=psycopg.connect("postgresql://kingphisher:kingphisher@127.0.0.1:5432/kingphisher_test"); c.autocommit=True; c.execute("CREATE ROLE audit_writer LOGIN PASSWORD " + chr(39) + "audit_writer" + chr(39)); c.close()'
          make db-migrate
      - name: Required PostgreSQL integration gate
        if: inputs.deployment_phase == 'workloads'
        run: make test-postgres
      - name: Required Redis integration gate
        if: inputs.deployment_phase == 'workloads'
        env:
          REDIS_URL_TEST: redis://127.0.0.1:6379/15
        run: make test-redis
      - name: Required fresh-migration gate
        if: inputs.deployment_phase == 'workloads'
        run: make test-fresh-migration
      - name: Build and start every release image
        if: inputs.deployment_phase == 'workloads'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: ""
          KP_IMAGE_EXPECTED_DOCKER_ENDPOINT: unix:///var/run/docker.sock
          KP_IMAGE_EXPECTED_DOCKER_ROOT_DIR: /var/lib/docker
          KP_IMAGE_EXPECTED_PLATFORM: linux/amd64
          KP_IMAGE_PREFIX: kingphisher/verify-ci-${{ github.run_id }}-${{ github.run_attempt }}
          KP_IMAGE_BUILD_STORAGE_PATH: ${{ runner.temp }}
          KP_IMAGE_QUALIFICATION_EVIDENCE_DIR: ${{ runner.temp }}/qualification-evidence/release-images
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-evidence"
          trivy_executable="$(realpath "$(command -v trivy)")"
          trivy_sha256="d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791"
          trivy_cache="$RUNNER_TEMP/trivy-qualification-cache"
          mkdir -p "$trivy_cache"
          expected_source_digest="$(/bin/bash scripts/operator/release/verify_images.sh --print-source-manifest-digest)"
          while IFS='=' read -r name _; do
            case "$name" in
              TRIVY_*) unset "$name" ;;
            esac
          done < <(env)
          KP_IMAGE_EXPECTED_SOURCE_MANIFEST_DIGEST="$expected_source_digest" \
          KP_TRIVY_EXECUTABLE="$trivy_executable" \
          KP_TRIVY_EXPECTED_SHA256="$trivy_sha256" \
          KP_TRIVY_CACHE_DIR="$trivy_cache" \
            make verify-images
      - name: Recheck the verifier-bound release images
        if: inputs.deployment_phase == 'workloads'
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_CONTEXT: ""
          KP_IMAGE_EXPECTED_DOCKER_ENDPOINT: unix:///var/run/docker.sock
          KP_IMAGE_EXPECTED_DOCKER_ROOT_DIR: /var/lib/docker
          KP_IMAGE_EXPECTED_PLATFORM: linux/amd64
          KP_IMAGE_PREFIX: kingphisher/verify-ci-${{ github.run_id }}-${{ github.run_attempt }}
          KP_IMAGE_BUILD_STORAGE_PATH: ${{ runner.temp }}
          KP_IMAGE_QUALIFICATION_EVIDENCE_DIR: ${{ runner.temp }}/qualification-evidence/release-images
        run: make security-scan-images
      - name: Upload qualification recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-qualification-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-evidence
          if-no-files-found: error
          retention-days: 90

  guard:
    name: Guard reviewed deployment inputs
    # Cheap, explicit refusal before any Azure call. Terraform enforces this too
    # (terraform_data.network_mode_guard), but failing here keeps the reason
    # legible instead of surfacing as a plan error deep in the deploy job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate opaque deployment request correlation
        env:
          DEPLOYMENT_REQUEST_ID: ${{ inputs.deployment_request_id }}
        run: |
          if [[ ! "$DEPLOYMENT_REQUEST_ID" =~ ^kp-[0-9a-f]{32}-[1-9][0-9]{0,2}$ ]]; then
            echo "::error::deployment_request_id must be an opaque GUI-issued correlation value"
            exit 1
          fi
      - name: Refuse source drift after GUI review
        env:
          REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
        run: |
          if [[ ! "$REVIEWED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::reviewed_commit_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$REVIEWED_COMMIT_SHA" ]]; then
            echo "::error::the deployment ref moved after GUI review; create and review a new plan"
            exit 1
          fi
      - name: Refuse starter mode for production
        if: inputs.environment == 'production' && inputs.network_mode == 'starter'
        run: |
          echo "::error::network_mode=starter exposes Postgres, Redis, Key Vault and the registry"
          echo "::error::to the public internet and must not be used for production."
          echo "::error::Deploy production with network_mode=private."
          exit 1
      - name: Record selected mode
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_NETWORK_MODE: ${{ inputs.network_mode }}
        run: echo "Deploying $DEPLOYMENT_ENVIRONMENT in $DEPLOYMENT_NETWORK_MODE network mode."

  deploy:
    name: Deploy reviewed Azure phase
    needs: [qualify, guard]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # Azure OIDC login; no stored Azure credential.
      attestations: write # Publish provenance and SBOM attestations for immutable images.
      artifact-metadata: write # Publish OCI-backed attestation metadata for image subjects.
    # Starter mode reaches public endpoints, so a hosted runner suffices and a
    # new tenant needs no bootstrap VM. Private mode must run inside the VNet.
    runs-on: ${{ inputs.network_mode == 'starter' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","azure-vnet"]') }}
    timeout-minutes: 120
    env:
      DEPLOYMENT_REQUEST_ID: ${{ inputs.deployment_request_id }}
      REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOYMENT_NETWORK_MODE: ${{ inputs.network_mode }}
      DEPLOYMENT_PHASE: ${{ inputs.deployment_phase }}
      TF_VAR_deployment_orchestration_mode: ${{ vars.DEPLOYMENT_ORCHESTRATION_MODE || 'disabled' }}
      TF_VAR_deployment_github_repository: ${{ vars.DEPLOYMENT_GITHUB_REPOSITORY }}
      TF_VAR_deployment_github_ref: ${{ vars.DEPLOYMENT_GITHUB_REF || 'main' }}
      TF_VAR_deployment_github_token_secret_id: ${{ vars.DEPLOYMENT_GITHUB_TOKEN_SECRET_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      # Terraform's azurerm provider must authenticate via OIDC directly; the
      # azure/login CLI session is a service principal, which azurerm rejects
      # for the ARM provider config ("only supported as a User").
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Initialize append-only deployment checkpoint
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/deployment-evidence"
          evidence_file="$evidence_dir/checkpoints.ndjson"
          helper="$RUNNER_TEMP/append-deployment-checkpoint.py"
          mkdir -p "$evidence_dir"
          echo "KP_DEPLOYMENT_EVIDENCE_FILE=$evidence_file" >> "$GITHUB_ENV"
          echo "KP_CHECKPOINT_HELPER=$helper" >> "$GITHUB_ENV"
          # GITHUB_ENV only reaches later steps, but the runner_preflight
          # checkpoint below runs in THIS step and the helper reads
          # KP_DEPLOYMENT_EVIDENCE_FILE from the environment, so export it here.
          export KP_DEPLOYMENT_EVIDENCE_FILE="$evidence_file"
          export KP_CHECKPOINT_HELPER="$helper"
          python3 - <<'PY'
          import os
          from pathlib import Path

          helper = Path(os.environ["RUNNER_TEMP"]) / "append-deployment-checkpoint.py"
          helper.write_text(r'''#!/usr/bin/env python3
          import argparse
          import hashlib
          import json
          import os
          import re
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path

          SCHEMA = "kp.azure-deployment-checkpoint.v1"
          STAGES = {
              "runner_preflight", "reviewed_configuration", "azure_authenticated",
              "terraform_state_initialized", "acs_control_plane_observed",
              "foundation_bootstrap_plan_safe", "foundation_bootstrap_applied",
              "bootstrap_integration_plan_published", "acs_verification_initiated",
              "foundation_finalize_plan_safe", "foundation_finalize_applied",
              "foundation_finalize_readback", "acs_stage_result_recorded",
              "immutable_images_verified", "workload_plan_safe",
              "workloads_applied", "migration_health_passed", "receipt_plan_safe",
              "receipts_activated", "cloud_operations_complete", "workflow_interrupted",
          }
          STATUSES = {"passed", "blocked", "uncertain"}
          DIGEST_NAMES = ("operator_api", "tracking_api", "worker", "migration", "ai_gateway")
          MAX_LEDGER_BYTES = 1_048_576
          MAX_RECORDS = 64

          def fail(message):
              raise SystemExit(message)

          def validated_context():
              context = {
                  "deployment_request_id": os.environ.get("DEPLOYMENT_REQUEST_ID", ""),
                  "reviewed_commit_sha": os.environ.get("REVIEWED_COMMIT_SHA", ""),
                  "environment": os.environ.get("DEPLOYMENT_ENVIRONMENT", ""),
                  "phase": os.environ.get("DEPLOYMENT_PHASE", ""),
                  "network_mode": os.environ.get("DEPLOYMENT_NETWORK_MODE", ""),
              }
              if re.fullmatch(r"kp-[0-9a-f]{32}-[1-9][0-9]{0,2}", context["deployment_request_id"]) is None:
                  fail("deployment request correlation is invalid")
              if re.fullmatch(r"[0-9a-f]{40}", context["reviewed_commit_sha"]) is None:
                  fail("reviewed commit is invalid")
              if context["environment"] not in {"staging", "production"}:
                  fail("deployment environment is invalid")
              if context["phase"] not in {"foundation_bootstrap", "foundation_finalize", "workloads"}:
                  fail("deployment phase is invalid")
              if context["network_mode"] not in {"starter", "private"}:
                  fail("deployment network mode is invalid")
              return context

          def validated_state_identity(environment):
              identity = {
                  "resource_group": os.environ.get("TF_STATE_RESOURCE_GROUP", ""),
                  "storage_account": os.environ.get("TF_STATE_STORAGE_ACCOUNT", ""),
                  "container": os.environ.get("TF_STATE_CONTAINER", ""),
                  "key": f"{environment}/kingphisher.tfstate",
              }
              patterns = {
                  "resource_group": r"[A-Za-z0-9_.()\-]{1,90}",
                  "storage_account": r"[a-z0-9]{3,24}",
                  "container": r"[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])?",
                  "key": r"(?:staging|production)/kingphisher\.tfstate",
              }
              if any(re.fullmatch(patterns[key], value) is None for key, value in identity.items()):
                  fail("non-secret Terraform state identity is missing or malformed")
              return identity

          def read_ledger(path, context, state_identity, workflow_run):
              if not path.exists():
                  return []
              if path.stat().st_size > MAX_LEDGER_BYTES:
                  fail("checkpoint ledger exceeds the fixed size limit")
              records = []
              previous_hash = None
              for raw_line in path.read_text(encoding="utf-8").splitlines():
                  try:
                      record = json.loads(raw_line)
                  except (TypeError, ValueError):
                      fail("checkpoint ledger contains malformed JSON")
                  if not isinstance(record, dict) or record.get("schema") != SCHEMA:
                      fail("checkpoint ledger schema is invalid")
                  supplied_hash = record.pop("record_sha256", None)
                  canonical = json.dumps(record, separators=(",", ":"), sort_keys=True)
                  calculated_hash = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
                  if supplied_hash != calculated_hash or record.get("previous_record_sha256") != previous_hash:
                      fail("checkpoint ledger integrity validation failed")
                  record["record_sha256"] = supplied_hash
                  if record.get("correlation") != context:
                      fail("checkpoint ledger correlation changed during the workflow")
                  if record.get("state_identity") != state_identity:
                      fail("checkpoint ledger Terraform state identity changed during the workflow")
                  if record.get("workflow_run") != workflow_run:
                      fail("checkpoint ledger workflow run identity changed during the workflow")
                  records.append(record)
                  previous_hash = supplied_hash
              if len(records) >= MAX_RECORDS:
                  fail("checkpoint ledger reached its fixed record limit")
              return records

          def carried_evidence(records):
              carried = {}
              for record in records:
                  evidence = record.get("evidence")
                  if not isinstance(evidence, dict):
                      continue
                  for key in ("image_digests", "migration_result", "health_result"):
                      if key in evidence:
                          carried[key] = evidence[key]
                  for key in (
                      "reviewed_deployment_digest", "acs_live_readiness_digest",
                      "acs_verification_initiation_digest", "acs_finalize_readback_digest",
                      "acs_stage_result_digest",
                  ):
                      if key in evidence:
                          carried[key] = evidence[key]
              return carried

          parser = argparse.ArgumentParser()
          parser.add_argument("--stage", choices=sorted(STAGES), required=True)
          parser.add_argument("--status", choices=sorted(STATUSES), required=True)
          args = parser.parse_args()
          context = validated_context()
          state_identity = validated_state_identity(context["environment"])
          workflow_run = {
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "job": "deploy",
          }
          if not workflow_run["run_id"].isdigit() or not workflow_run["run_attempt"].isdigit():
              fail("workflow run identity is invalid")
          path = Path(os.environ["KP_DEPLOYMENT_EVIDENCE_FILE"])
          records = read_ledger(path, context, state_identity, workflow_run)
          if any(record.get("stage") == args.stage for record in records):
              fail("checkpoint stage was already recorded for this workflow run")
          evidence = carried_evidence(records)

          digest_values = {name: os.environ.get(f"KP_{name.upper()}_DIGEST", "") for name in DIGEST_NAMES}
          if any(digest_values.values()):
              if not all(re.fullmatch(r"sha256:[0-9a-f]{64}", value) for value in digest_values.values()):
                  fail("immutable image digest evidence is incomplete or malformed")
              evidence["image_digests"] = digest_values
          for field, environment_name in (
              ("reviewed_deployment_digest", "KP_REVIEWED_DEPLOYMENT_DIGEST"),
              ("acs_live_readiness_digest", "KP_ACS_LIVE_READINESS_DIGEST"),
              ("acs_verification_initiation_digest", "KP_ACS_VERIFICATION_INITIATION_DIGEST"),
              ("acs_finalize_readback_digest", "KP_ACS_FINALIZE_READBACK_DIGEST"),
              ("acs_stage_result_digest", "KP_ACS_STAGE_RESULT_DIGEST"),
          ):
              value = os.environ.get(environment_name, "")
              if value:
                  if re.fullmatch(r"sha256:[0-9a-f]{64}", value) is None:
                      fail(f"{field} evidence is malformed")
                  evidence[field] = value
          for field, environment_name in (
              ("migration_result", "KP_MIGRATION_RESULT"),
              ("health_result", "KP_HEALTH_RESULT"),
          ):
              value = os.environ.get(environment_name, "")
              if value:
                  if value not in {"passed", "blocked", "uncertain", "not_applicable"}:
                      fail(f"{field} evidence is invalid")
                  evidence[field] = value
          if args.stage == "runner_preflight":
              minimum = 10 * 1024**3
              free = shutil.disk_usage(path.parent).free
              evidence.update({
                  "free_bytes": free,
                  "minimum_free_bytes": minimum,
                  "automatic_cleanup_allowed": False,
                  "mutation_performed": False,
              })
              if free < minimum:
                  args.status = "blocked"

          if args.status != "passed":
              evidence["last_successful_stage"] = next(
                  (
                      record.get("stage")
                      for record in reversed(records)
                      if record.get("status") == "passed"
                  ),
                  None,
              )

          safe_next_action = (
              "Cloud operations completed; do not automatically retry. Require the uploaded evidence artifact "
              "and reconcile the workflow run status."
              if args.stage == "cloud_operations_complete" and args.status == "passed"
              else "Continue from the recorded checkpoint through the reviewed deployment workflow."
              if args.status == "passed"
              else "Reconcile this correlation ID with Terraform and Azure state before retrying; "
                   "do not destroy, delete, or recreate resources."
          )
          previous_hash = records[-1]["record_sha256"] if records else None
          record = {
              "schema": SCHEMA,
              "sequence": len(records) + 1,
              "recorded_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "correlation": context,
              "workflow_run": workflow_run,
              "state_identity": state_identity,
              "stage": args.stage,
              "status": args.status,
              "evidence": evidence,
              "safe_next_action": safe_next_action,
              "previous_record_sha256": previous_hash,
          }
          canonical = json.dumps(record, separators=(",", ":"), sort_keys=True)
          record["record_sha256"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          with path.open("a", encoding="utf-8") as output:
              output.write(json.dumps(record, separators=(",", ":"), sort_keys=True) + "\n")
              output.flush()
              os.fsync(output.fileno())
          if args.stage == "runner_preflight" and args.status != "passed":
              fail("runner disk headroom is below the required 10 GiB; no cleanup was attempted")
          ''', encoding="utf-8")
          PY
          python3 "$helper" --stage runner_preflight --status passed
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate and materialize reviewed deployment values
        env:
          REVIEWED_DEPLOYMENT_CONFIG: ${{ inputs.deployment_config }}
          PROTECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PROTECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          expected = {
              "subscription_id", "location", "name_prefix", "operator_fqdn", "tracking_fqdn",
              "entra_tenant_id", "entra_client_id", "acs_resource_mode",
              "acs_existing_communication_service_id", "acs_existing_email_endpoint",
              "acs_existing_email_domain_id", "acs_sending_domain", "acs_sender_local_part",
              "acs_sender_display_name", "acs_dns_zone_id", "acs_domain_verification_status",
              "acs_spf_verification_status", "acs_dkim_verification_status",
              "acs_dkim2_verification_status", "acs_sender_username_status",
              "acs_domain_association_status", "acs_readiness_checked_at", "acs_daily_message_limit",
              "acs_messages_per_minute", "acs_ramp_batch_size", "acs_ramp_interval_seconds",
              "communication_data_location", "ai_endpoint", "enable_directory_sync",
              "directory_group_ids", "enable_reported_mailbox", "reported_mailbox_address",
              "reported_mailbox_folder", "alert_webhook_domains", "allowed_recipient_domains",
              "ciphertext_active_key_id", "ciphertext_prior_key_ids",
              "ciphertext_prior_keys_secret_id",
          }
          raw = os.environ["REVIEWED_DEPLOYMENT_CONFIG"]
          if len(raw.encode("utf-8")) > 32_768:
              raise SystemExit("reviewed deployment configuration exceeds the fixed limit")
          config = json.loads(raw)
          if not isinstance(config, dict) or set(config) != expected:
              raise SystemExit("reviewed deployment configuration has an invalid key contract")
          if any(
              not isinstance(value, str) or len(value) > 2_048 or "\n" in value or "\r" in value
              for value in config.values()
          ):
              raise SystemExit("reviewed deployment configuration values must be bounded single-line strings")
          credential_pattern = re.compile(
              r"(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16}|"
              r"(?:password|secret|token|api[_-]?key|authorization|accountkey)\s*[:=]\s*\S+|"
              r"bearer\s+[A-Za-z0-9._~+/=-]{8,})",
              re.IGNORECASE,
          )
          if any(credential_pattern.search(value) for value in config.values()):
              raise SystemExit("reviewed deployment configuration must not contain credentials or tokens")
          if config["subscription_id"].lower() != os.environ["PROTECTED_SUBSCRIPTION_ID"].lower():
              raise SystemExit("reviewed subscription does not match the protected deployment identity")
          if config["entra_tenant_id"].lower() != os.environ["PROTECTED_TENANT_ID"].lower():
              raise SystemExit("reviewed tenant does not match the protected deployment identity")
          reviewed_canonical = json.dumps(config, separators=(",", ":"), sort_keys=True)
          reviewed_digest = "sha256:" + hashlib.sha256(reviewed_canonical.encode("utf-8")).hexdigest()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"KP_REVIEWED_DEPLOYMENT_DIGEST={reviewed_digest}\n")
          key_id_pattern = re.compile(r"[A-Za-z0-9][A-Za-z0-9_-]{0,31}\Z")
          active_key_id = config["ciphertext_active_key_id"]
          prior_key_ids = (
              [value.strip() for value in config["ciphertext_prior_key_ids"].split(",")]
              if config["ciphertext_prior_key_ids"].strip()
              else []
          )
          prior_secret_id = config["ciphertext_prior_keys_secret_id"]
          if key_id_pattern.fullmatch(active_key_id) is None:
              raise SystemExit("ciphertext active key identifier is invalid")
          if (
              len(prior_key_ids) > 4
              or len(set(prior_key_ids)) != len(prior_key_ids)
              or active_key_id in prior_key_ids
              or any(key_id_pattern.fullmatch(value) is None for value in prior_key_ids)
          ):
              raise SystemExit("ciphertext prior key identifiers are invalid")
          if bool(prior_key_ids) != bool(prior_secret_id):
              raise SystemExit("ciphertext prior key IDs and Key Vault reference must be supplied together")
          if prior_secret_id and re.fullmatch(
              r"/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/"
              r"vaults/[A-Za-z0-9-]{3,24}/secrets/[A-Za-z0-9-]{1,127}",
              prior_secret_id,
              flags=re.IGNORECASE,
          ) is None:
              raise SystemExit("ciphertext prior key reference must be a versionless Key Vault secret ID")
          if os.environ["DEPLOYMENT_PHASE"] != "workloads" and (prior_key_ids or prior_secret_id):
              raise SystemExit("ciphertext prior-key recovery is allowed only during the workloads phase")
          # Reviewed values describe operator intent, not proof. Always replace
          # every ACS readiness assertion before Terraform sees this file. The
          # authenticated control-plane step below is the only code allowed to
          # promote these fields to verified and attach a current timestamp.
          for key in (
              "acs_domain_verification_status", "acs_spf_verification_status",
              "acs_dkim_verification_status", "acs_dkim2_verification_status",
              "acs_sender_username_status", "acs_domain_association_status",
          ):
              config[key] = "pending_live_readback"
          config["acs_readiness_checked_at"] = ""
          for key in (
              "acs_daily_message_limit", "acs_messages_per_minute", "acs_ramp_batch_size",
              "acs_ramp_interval_seconds",
          ):
              config[key] = int(config[key])
          config["graph_endpoint"] = (
              "https://graph.microsoft.com/v1.0" if config.pop("enable_directory_sync") == "true" else ""
          )
          config["reported_mailbox_endpoint"] = (
              "https://graph.microsoft.com/v1.0" if config.pop("enable_reported_mailbox") == "true" else ""
          )
          target = Path(os.environ["RUNNER_TEMP"]) / "reviewed.auto.tfvars.json"
          target.write_text(json.dumps(config, separators=(",", ":"), sort_keys=True), encoding="utf-8")
          PY
      - name: Checkpoint reviewed configuration
        run: python3 "$KP_CHECKPOINT_HELPER" --stage reviewed_configuration --status passed
      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Checkpoint Azure authentication
        run: python3 "$KP_CHECKPOINT_HELPER" --stage azure_authenticated --status passed
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          # No step consumes the wrapper stdout/stderr/exitcode outputs, and the
          # wrapper merges Terraform's stderr warnings ("No outputs found" on an
          # empty pre-apply state) into stdout, tripping the output size guards.
          terraform_wrapper: false
      - name: Install pinned Syft
        if: inputs.deployment_phase == 'workloads'
