      - name: Migrate and qualify
        if: inputs.deployment_phase == 'workloads'
        shell: bash
        run: |
          AZURE_RESOURCE_GROUP="$(terraform -chdir=infrastructure/terraform output -raw resource_group_name)"
          AZURE_MIGRATION_JOB="$(terraform -chdir=infrastructure/terraform output -raw migration_job_name)"
          AZURE_OPERATOR_URL="https://$(terraform -chdir=infrastructure/terraform output -raw operator_default_hostname)"
          AZURE_TRACKING_URL="https://$(terraform -chdir=infrastructure/terraform output -raw tracking_default_hostname)"
          export AZURE_RESOURCE_GROUP AZURE_MIGRATION_JOB AZURE_OPERATOR_URL AZURE_TRACKING_URL
