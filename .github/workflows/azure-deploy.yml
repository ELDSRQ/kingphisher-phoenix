        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3
      - name: Install pinned Trivy for immutable registry scans
        if: inputs.deployment_phase == 'workloads'
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true
      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: >-
          terraform init
          -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
          -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
          -backend-config="container_name=$TF_STATE_CONTAINER"
          -backend-config="key=$DEPLOYMENT_ENVIRONMENT/kingphisher.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Checkpoint Terraform state identity
        run: python3 "$KP_CHECKPOINT_HELPER" --stage terraform_state_initialized --status passed
      - name: Read ACS readiness from the authenticated Azure control plane
        env:
          PROTECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PROTECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          KP_ALLOW_EMAIL_DOMAIN_REPLACEMENT: ${{ inputs.allow_email_domain_replacement }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from urllib.parse import quote

          API_VERSION = "2023-04-01"
          READY_PROVISIONING_STATES = {"running", "succeeded"}
          MAX_CONTROL_PLANE_BYTES = 65_536
          UUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\Z", re.I)
          DOMAIN = re.compile(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\Z")
          SENDER = re.compile(r"[a-z0-9][a-z0-9._+-]{0,63}\Z")

          def fail(message):
              raise SystemExit(message)

          def run_json(command, label, *, max_bytes=MAX_CONTROL_PLANE_BYTES):
              try:
                  result = subprocess.run(
                      command,
                      check=False,
                      capture_output=True,
                      timeout=60,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail(f"{label} is inaccessible")
              if result.returncode != 0:
                  # Provider response bodies can contain operational detail and
                  # are deliberately not echoed into the workflow log.
                  fail(f"{label} is missing, ambiguous, or inaccessible")
              if len(result.stdout) > max_bytes:
                  fail(f"{label} exceeds the fixed response limit")
              try:
                  value = json.loads(result.stdout)
              except (TypeError, ValueError):
                  fail(f"{label} returned malformed JSON")
              return value

          def terraform_json_output(name):
              result = subprocess.run(
                  ["terraform", "-chdir=infrastructure/terraform", "output", "-json", name],
                  check=False,
                  capture_output=True,
                  timeout=30,
              )
              if result.returncode != 0:
                  return None
              if not result.stdout.strip():
                  return None
              if len(result.stdout) > 16_384:
                  fail(f"Terraform output {name} exceeds the fixed response limit")
              try:
                  return json.loads(result.stdout)
              except (TypeError, ValueError):
                  fail(f"Terraform output {name} is malformed")

          def terraform_raw_output(name):
              # Use -json (not -raw): on a state with zero outputs, "output -raw
              # <name>" prints Terraform's multi-line "No outputs found" warning to
              # stdout and exits 0, tripping the size guard. "-json <name>" exits 1
              # for a missing output and never emits that warning to stdout.
              result = subprocess.run(
                  ["terraform", "-chdir=infrastructure/terraform", "output", "-json", name],
                  check=False,
                  capture_output=True,
                  timeout=30,
              )
              if result.returncode != 0:
                  return None
              if not result.stdout.strip():
                  return None
              if len(result.stdout) > 512:
                  fail(f"Terraform output {name} exceeds the fixed response limit")
              try:
                  value = json.loads(result.stdout)
              except (TypeError, ValueError):
                  fail(f"Terraform output {name} is malformed")
              if value is None:
                  return None
              return str(value).strip() or None

          def az_rest(resource_id, query):
              return run_json(
                  [
                      "az", "rest", "--method", "get", "--uri",
                      f"https://management.azure.com{resource_id}?api-version={API_VERSION}",
                      "--query", query, "--output", "json", "--only-show-errors",
                  ],
                  "selected ACS control-plane resource",
              )

          def split_resource_id(resource_id, expected_segments, label):
              if not isinstance(resource_id, str) or len(resource_id) > 2_048 or any(
                  marker in resource_id for marker in ("?", "#", "\n", "\r")
              ):
                  fail(f"{label} resource ID is malformed")
              segments = resource_id.strip("/").split("/")
              if len(segments) != expected_segments or any(not segment for segment in segments):
                  fail(f"{label} resource ID is malformed")
              if segments[0].lower() != "subscriptions" or UUID.fullmatch(segments[1]) is None:
                  fail(f"{label} resource ID is malformed")
              if segments[2].lower() != "resourcegroups" or segments[4].lower() != "providers":
                  fail(f"{label} resource ID is malformed")
              if segments[5].lower() != "microsoft.communication":
                  fail(f"{label} resource ID is malformed")
              if segments[1].lower() != subscription_id:
                  fail(f"{label} belongs to a different subscription")
              return segments

          def require_resource_identity(value, expected_id, expected_type, label):
              if not isinstance(value, dict):
                  fail(f"{label} selected fields are malformed")
              if str(value.get("id", "")).lower() != expected_id.lower():
                  fail(f"{label} readback does not match the reviewed resource ID")
              if str(value.get("type", "")).lower() != expected_type.lower():
                  fail(f"{label} readback has an unexpected resource type")

          def require_ready_state(value, label):
              state = value.get("provisioningState") if isinstance(value, dict) else None
              if not isinstance(state, str) or state.lower() not in READY_PROVISIONING_STATES:
                  fail(f"{label} is not in a ready provisioning state")
              return state.lower()

          def discover_one(resource_group, resource_type, label):
              encoded_group = quote(resource_group, safe="._()-")
              selected = run_json(
                  [
                      "az", "rest", "--method", "get", "--uri",
                      f"https://management.azure.com/subscriptions/{subscription_id}/resourceGroups/"
                      f"{encoded_group}/resources?api-version=2021-04-01",
                      "--query", "{value:value[].{id:id,type:type,application:tags.application,environment:tags.environment},nextLink:nextLink}",
                      "--output", "json", "--only-show-errors",
                  ],
                  f"{label} discovery",
              )
              if not isinstance(selected, dict) or selected.get("nextLink"):
                  fail(f"{label} discovery is ambiguous or paginated")
              values = selected.get("value")
              if not isinstance(values, list) or len(values) > 256:
                  fail(f"{label} discovery is malformed")
              matches = [
                  item["id"] for item in values
                  if isinstance(item, dict)
                  and str(item.get("type", "")).lower() == resource_type.lower()
                  and item.get("application") == "kingphisher-phoenix"
                  and item.get("environment") == os.environ["DEPLOYMENT_ENVIRONMENT"]
                  and isinstance(item.get("id"), str)
              ]
              if len(matches) != 1:
                  fail(f"{label} discovery did not resolve exactly one project resource")
              return matches[0]

          config_path = Path(os.environ["RUNNER_TEMP"]) / "reviewed.auto.tfvars.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          subscription_id = os.environ["PROTECTED_SUBSCRIPTION_ID"].lower()
          tenant_id = os.environ["PROTECTED_TENANT_ID"].lower()
          if UUID.fullmatch(subscription_id) is None or UUID.fullmatch(tenant_id) is None:
              fail("protected Azure identity is malformed")
          reviewed_digest = os.environ.get("KP_REVIEWED_DEPLOYMENT_DIGEST", "")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", reviewed_digest) is None:
              fail("reviewed deployment digest is missing or malformed")
          reviewed_commit = os.environ["REVIEWED_COMMIT_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", reviewed_commit) is None:
              fail("reviewed commit is malformed")

          account = run_json(
              [
                  "az", "account", "show", "--query", "{subscriptionId:id,tenantId:tenantId}",
                  "--output", "json", "--only-show-errors",
              ],
              "authenticated Azure account",
              max_bytes=4_096,
          )
          if not isinstance(account, dict) or str(account.get("subscriptionId", "")).lower() != subscription_id:
              fail("authenticated Azure subscription does not match the reviewed deployment")
          if str(account.get("tenantId", "")).lower() != tenant_id:
              fail("authenticated Azure tenant does not match the reviewed deployment")

          mode = config.get("acs_resource_mode")
          phase = os.environ["DEPLOYMENT_PHASE"]
          sending_domain = str(config.get("acs_sending_domain", "")).strip().lower()
          sender_local_part = str(config.get("acs_sender_local_part", "")).strip().lower()
          if mode not in {"existing", "provision"}:
              fail("ACS resource mode is invalid")
          if DOMAIN.fullmatch(sending_domain) is None or SENDER.fullmatch(sender_local_part) is None:
              fail("reviewed ACS sender identity is malformed")

          resources = None
          resource_group = None
          if mode == "existing":
              communication_service_id = config.get("acs_existing_communication_service_id")
              email_domain_id = config.get("acs_existing_email_domain_id")
          else:
              resources = terraform_json_output("acs_control_plane_resources")
              if resources is None:
                  resource_group = terraform_raw_output("resource_group_name")
                  if resource_group is None:
                      if phase != "foundation_bootstrap":
                          fail("finalize and workloads require an applied ACS bootstrap before live readiness")
                      communication_service_id = None
                      email_domain_id = None
                  else:
                      communication_service_id = discover_one(
                          resource_group,
                          "Microsoft.Communication/CommunicationServices",
                          "Communication Service",
                      )
                      email_service_id = discover_one(
                          resource_group,
                          "Microsoft.Communication/EmailServices",
                          "Email Communication Service",
                      )
                      email_domain_id = f"{email_service_id}/domains/{sending_domain}"
              else:
                  if not isinstance(resources, dict) or set(resources) != {
                      "resource_group_name", "communication_service_id", "email_domain_id", "sender_username_id"
                  }:
                      fail("stored ACS control-plane resource identities are malformed")
                  resource_group = resources["resource_group_name"]
                  communication_service_id = resources["communication_service_id"]
                  email_domain_id = resources["email_domain_id"]

          # A sending-domain rotation is about to replace the ACS email domain, so
          # the reviewed (new) domain intentionally differs from whatever is live.
          # Skip the live-domain match and treat readiness as pending; the plan
          # allowlist enforces that only the ACS email slice is replaced.
          if (
              os.environ.get("KP_ALLOW_EMAIL_DOMAIN_REPLACEMENT", "false").strip().lower() == "true"
              and phase == "foundation_bootstrap"
          ):
              communication_service_id = None
              email_domain_id = None

          observed_at = datetime.now(UTC).isoformat().replace("+00:00", "Z")
          statuses = {
              "domain": "not_observed",
              "spf": "not_observed",
              "dkim": "not_observed",
              "dkim2": "not_observed",
              "sender": "not_observed",
              "association": "not_observed",
          }
          resource_ids = {}
          evidence_result = "foundation_bootstrap_pending"

          if communication_service_id is not None and email_domain_id is not None:
              communication_parts = split_resource_id(
                  communication_service_id, 8, "Communication Service"
              )
              domain_parts = split_resource_id(email_domain_id, 10, "email domain")
              if communication_parts[6].lower() != "communicationservices":
                  fail("Communication Service resource ID is malformed")
              if domain_parts[6].lower() != "emailservices" or domain_parts[8].lower() != "domains":
                  fail("email domain resource ID is malformed")
              if domain_parts[9].lower() != sending_domain:
                  fail("email domain resource ID does not match the reviewed sending domain")
              if mode == "provision" and (
                  communication_parts[3].lower() != str(resource_group).lower()
                  or domain_parts[3].lower() != str(resource_group).lower()
              ):
                  fail("provisioned ACS resources do not belong to the Terraform resource group")
              email_service_id = "/" + "/".join(domain_parts[:8])
              sender_username_id = f"{email_domain_id}/senderUsernames/{sender_local_part}"
              if resources is not None and str(resources["sender_username_id"]).lower() != sender_username_id.lower():
                  fail("stored sender username identity does not match the reviewed local part")

              communication = az_rest(
                  communication_service_id,
                  "{id:id,type:type,provisioningState:properties.provisioningState,linkedDomains:properties.linkedDomains,hostName:properties.hostName,dataLocation:properties.dataLocation}",
              )
              email_service = az_rest(
                  email_service_id,
                  "{id:id,type:type,provisioningState:properties.provisioningState,dataLocation:properties.dataLocation}",
              )
              domain = az_rest(
                  email_domain_id,
                  "{id:id,type:type,provisioningState:properties.provisioningState,domainManagement:properties.domainManagement,fromSenderDomain:properties.fromSenderDomain,Domain:properties.verificationStates.Domain.status,SPF:properties.verificationStates.SPF.status,DKIM:properties.verificationStates.DKIM.status,DKIM2:properties.verificationStates.DKIM2.status,dataLocation:properties.dataLocation}",
              )
              require_resource_identity(
                  communication, communication_service_id,
                  "Microsoft.Communication/CommunicationServices", "Communication Service",
              )
              require_resource_identity(
                  email_service, email_service_id,
                  "Microsoft.Communication/EmailServices", "Email Communication Service",
              )
              require_resource_identity(
                  domain, email_domain_id,
                  "Microsoft.Communication/EmailServices/Domains", "email domain",
              )
              require_ready_state(communication, "Communication Service")
              require_ready_state(email_service, "Email Communication Service")
              require_ready_state(domain, "email domain")
              if mode == "existing":
                  reviewed_endpoint = str(config.get("acs_existing_email_endpoint", "")).rstrip("/").lower()
                  live_endpoint = f"https://{str(communication.get('hostName', '')).lower()}"
                  if live_endpoint != reviewed_endpoint:
                      fail("live Communication Service endpoint differs from the reviewed endpoint")
              if str(domain.get("fromSenderDomain", "")).lower() != sending_domain:
                  fail("live email domain does not match the reviewed sending domain")
              if domain.get("domainManagement") not in {"CustomerManaged", "CustomerManagedInExchangeOnline"}:
                  fail("live email domain is not customer managed")
              # Azure returns dataLocation in the compact enum form
              # ("UnitedStates") while the reviewed config and the azurerm
              # provider use the spaced form ("United States"). Compare the
              # geography with all whitespace removed so the two spellings of the
              # same data-residency location match.
              def _norm_location(raw):
                  return "".join(str(raw).split()).lower()
              expected_data_location = _norm_location(config.get("communication_data_location", ""))
              for value, label in (
                  (communication, "Communication Service"),
                  (email_service, "Email Communication Service"),
                  (domain, "email domain"),
              ):
                  if _norm_location(value.get("dataLocation", "")) != expected_data_location:
                      fail(f"{label} data location differs from the reviewed deployment")

              statuses.update({
                  key.lower(): str(domain.get(key, "")).lower()
                  for key in ("Domain", "SPF", "DKIM", "DKIM2")
              })
              domain_verified = all(statuses[key] == "verified" for key in ("domain", "spf", "dkim", "dkim2"))
              if phase in {"foundation_finalize", "workloads"} and not domain_verified:
                  fail("finalize and workloads require live Verified Domain, SPF, DKIM, and DKIM2 states")

              linked_domains = communication.get("linkedDomains")
              if linked_domains is None:
                  linked_domains = []
              if not isinstance(linked_domains, list) or len(linked_domains) > 64 or any(
                  not isinstance(value, str) for value in linked_domains
              ):
                  fail("Communication Service domain associations are malformed or ambiguous")
              association_matches = sum(
                  value.lower() == email_domain_id.lower() for value in linked_domains
              )
              statuses["association"] = "verified" if association_matches == 1 else "not_linked"
              if association_matches > 1:
                  fail("Communication Service has an ambiguous duplicate domain association")

              if phase == "workloads":
                  if association_matches != 1:
                      fail("workloads require the exact live ACS email-domain association")
                  sender = az_rest(
                      sender_username_id,
                      "{id:id,type:type,provisioningState:properties.provisioningState,username:properties.username,displayName:properties.displayName,dataLocation:properties.dataLocation}",
                  )
                  require_resource_identity(
                      sender, sender_username_id,
                      "Microsoft.Communication/EmailServices/Domains/SenderUsernames", "sender username",
                  )
                  # SenderUsername provisioningState is optional in the
                  # 2023-04-01 response and Microsoft's own valid sample omits
                  # it. When Azure does report a state, it must be ready. A
                  # successful exact GET still has to pass identity, username,
                  # display-name, and any explicitly reported data-location
                  # check below. The three required parent locations remain
                  # authoritative when SenderUsername omits that optional field.
                  if sender.get("provisioningState") is not None:
                      require_ready_state(sender, "sender username")
                  if str(sender.get("username", "")).lower() != sender_local_part:
                      fail("live sender username does not match the reviewed local part")
                  if str(sender.get("displayName", "")) != str(config.get("acs_sender_display_name", "")).strip():
                      fail("live sender display name does not match the reviewed deployment")
                  sender_data_location = sender.get("dataLocation")
                  if (
                      sender_data_location is not None
                      and _norm_location(sender_data_location) != expected_data_location
                  ):
                      fail("live sender data location differs from the reviewed deployment")
                  statuses["sender"] = "verified"
                  evidence_result = "workloads_verified"
              elif phase == "foundation_finalize" and domain_verified:
                  evidence_result = "foundation_finalize_domain_verified_preapply"
              elif domain_verified:
                  evidence_result = "foundation_bootstrap_domain_already_verified"
              else:
                  evidence_result = "foundation_bootstrap_domain_pending"

              resource_ids = {
                  "communication_service_id": communication_service_id,
                  "email_service_id": email_service_id,
                  "email_domain_id": email_domain_id,
                  "sender_username_id": sender_username_id,
              }

          for key, config_key in (
              ("domain", "acs_domain_verification_status"),
              ("spf", "acs_spf_verification_status"),
              ("dkim", "acs_dkim_verification_status"),
              ("dkim2", "acs_dkim2_verification_status"),
              ("sender", "acs_sender_username_status"),
              ("association", "acs_domain_association_status"),
          ):
              config[config_key] = statuses[key]
          config["acs_readiness_checked_at"] = (
              observed_at if all(statuses[key] == "verified" for key in ("domain", "spf", "dkim", "dkim2")) else ""
          )
          config_path.write_text(json.dumps(config, separators=(",", ":"), sort_keys=True), encoding="utf-8")

          evidence = {
              "schema": "kp.acs-live-readiness.v1",
              "observed_at": observed_at,
              "result": evidence_result,
              "phase": phase,
              "resource_mode": mode,
              "subscription_id": subscription_id,
              "tenant_id": tenant_id,
              "resource_ids": resource_ids,
              "statuses": statuses,
              "reviewed_commit_sha": reviewed_commit,
              "reviewed_deployment_digest": reviewed_digest,
              "workflow_run": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "api_version": API_VERSION,
              "scope_limits": {
                  "dns_provider_state_only": True,
                  "inbox_placement_proven": False,
                  "event_grid_delivery_proven": False,
                  "human_mailbox_validation_proven": False,
              },
          }
          canonical = json.dumps(evidence, separators=(",", ":"), sort_keys=True)
          evidence_digest = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          evidence["evidence_digest"] = evidence_digest
          evidence_path = Path(os.environ["RUNNER_TEMP"]) / "deployment-evidence" / "acs-live-readiness.json"
          with evidence_path.open("x", encoding="utf-8") as output:
              output.write(json.dumps(evidence, separators=(",", ":"), sort_keys=True) + "\n")
              output.flush()
              os.fsync(output.fileno())
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"KP_ACS_LIVE_READINESS_DIGEST={evidence_digest}\n")
          PY
      - name: Checkpoint live ACS control-plane observation
        run: python3 "$KP_CHECKPOINT_HELPER" --stage acs_control_plane_observed --status passed
      - name: Validate ciphertext key-rotation lifecycle metadata
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          import os
          from urllib.parse import urlsplit

          config = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "reviewed.auto.tfvars.json").read_text(encoding="utf-8")
          )

          def terraform_outputs():
              result = subprocess.run(
                  ["terraform", "output", "-json"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise SystemExit("ciphertext lifecycle state is inaccessible")
              try:
                  outputs = json.loads(result.stdout)
              except (TypeError, ValueError):
                  raise SystemExit("stored ciphertext lifecycle metadata is malformed") from None
              if not isinstance(outputs, dict):
                  raise SystemExit("stored ciphertext lifecycle metadata is malformed")
              return outputs

          phase = os.environ["DEPLOYMENT_PHASE"]
          outputs = terraform_outputs()
          keyring_output = outputs.get("ciphertext_keyring")
          if keyring_output is None:
              if phase == "foundation_bootstrap" and not outputs:
                  # A brand-new foundation has no outputs. Every subsequent
                  # dispatch has state and must preserve the established active ID.
                  raise SystemExit(0)
              raise SystemExit("ACS bootstrap state is required before ciphertext lifecycle validation")
          if not isinstance(keyring_output, dict) or "value" not in keyring_output:
              raise SystemExit("stored ciphertext lifecycle metadata is malformed")
          previous = keyring_output["value"]
          if not isinstance(previous, dict):
              raise SystemExit("stored ciphertext lifecycle metadata is malformed")
          active_key_id = config["ciphertext_active_key_id"]
          prior_key_ids = (
              [value.strip() for value in config["ciphertext_prior_key_ids"].split(",")]
              if config["ciphertext_prior_key_ids"].strip()
              else []
          )
          prior_secret_id = config["ciphertext_prior_keys_secret_id"]
          previous_active = previous.get("active_key_id")
          previous_prior = previous.get("prior_key_ids")
          if not isinstance(previous_active, str) or not isinstance(previous_prior, list) or any(
              not isinstance(value, str) for value in previous_prior
          ):
              raise SystemExit("stored ciphertext lifecycle metadata is malformed")
          if not set(previous_prior).issubset(prior_key_ids):
              raise SystemExit("prior decrypt-only keys cannot be removed without a reviewed re-encryption gate")
          if active_key_id != previous_active:
              raise SystemExit(
                  "active ciphertext key changes are blocked until rolling pre-stage and promotion are implemented"
              )
          if not prior_key_ids:
              if prior_secret_id:
                  raise SystemExit("ciphertext prior key reference is inconsistent")
              raise SystemExit(0)
          vault_output = outputs.get("key_vault_id")
          if not isinstance(vault_output, dict) or not isinstance(vault_output.get("value"), str):
              raise SystemExit("stored ciphertext lifecycle metadata is malformed")
          vault_id = vault_output["value"]
          expected_prefix = f"{vault_id}/secrets/".lower()
          if not prior_secret_id.lower().startswith(expected_prefix):
              raise SystemExit("ciphertext prior key reference belongs to a different Key Vault")
          reference_match = re.fullmatch(
              r"/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.KeyVault/"
              r"vaults/([A-Za-z0-9-]{3,24})/secrets/([A-Za-z0-9-]{1,127})",
              prior_secret_id,
              flags=re.IGNORECASE,
          )
          if reference_match is None:
              raise SystemExit("ciphertext prior key reference is malformed")
          vault_name, secret_name = reference_match.groups()

          metadata_result = subprocess.run(
              [
                  "az", "keyvault", "secret", "show", "--vault-name", vault_name, "--name", secret_name,
                  "--query", "{id:id,enabled:attributes.enabled,expires:attributes.expires,tags:tags}",
                  "--output", "json",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          if metadata_result.returncode != 0:
              raise SystemExit("ciphertext prior-key reference is missing or inaccessible")
          if len(metadata_result.stdout.encode("utf-8")) > 16_384:
              raise SystemExit("ciphertext prior-key lifecycle metadata exceeds the fixed limit")
          try:
              metadata = json.loads(metadata_result.stdout)
              metadata_id = metadata["id"]
              tags = metadata["tags"]
              enabled = metadata["enabled"] is True
              expires = metadata.get("expires")
          except (KeyError, TypeError, ValueError):
              raise SystemExit("ciphertext prior-key lifecycle metadata is malformed") from None
          parsed_metadata_id = urlsplit(metadata_id) if isinstance(metadata_id, str) else None
          if (
              parsed_metadata_id is None
              or parsed_metadata_id.scheme != "https"
              or parsed_metadata_id.hostname != f"{vault_name.lower()}.vault.azure.net"
              or not parsed_metadata_id.path.lower().startswith(f"/secrets/{secret_name.lower()}/")
          ):
              raise SystemExit("ciphertext prior-key lifecycle metadata does not match its versionless reference")
          if not enabled:
              raise SystemExit("ciphertext prior-key reference is disabled")
          if expires:
              try:
                  expiry = datetime.fromisoformat(str(expires).replace("Z", "+00:00"))
              except ValueError:
                  raise SystemExit("ciphertext prior-key expiry metadata is malformed") from None
              if expiry.tzinfo is None or expiry.astimezone(UTC) <= datetime.now(UTC):
                  raise SystemExit("ciphertext prior-key reference is expired")
          expected_tags = {
              "kp-ciphertext-format": "kpct-rotation-v1",
              "kp-ciphertext-prior-key-ids": ",".join(prior_key_ids),
              "kp-ciphertext-active-key-id": active_key_id,
          }
          if not isinstance(tags, dict) or any(tags.get(key) != value for key, value in expected_tags.items()):
              raise SystemExit("ciphertext prior-key reference tags do not match the reviewed key lifecycle")
          PY
      - name: Plan ACS foundation bootstrap
        if: inputs.deployment_phase == 'foundation_bootstrap'
        working-directory: infrastructure/terraform
        run: >-
          terraform plan -out=foundation-bootstrap.tfplan
          -var-file="environments/$DEPLOYMENT_ENVIRONMENT.tfvars"
          -var-file="$RUNNER_TEMP/reviewed.auto.tfvars.json"
          -var="environment=$DEPLOYMENT_ENVIRONMENT"
          -var="network_mode=$DEPLOYMENT_NETWORK_MODE"
          -var="deploy_workloads=false"
          -var="acs_deployment_stage=foundation_bootstrap"
      - name: Enforce ACS foundation bootstrap plan allowlist
        if: inputs.deployment_phase == 'foundation_bootstrap'
        working-directory: infrastructure/terraform
        shell: bash
        env:
          KP_ALLOW_EMAIL_DOMAIN_REPLACEMENT: ${{ inputs.allow_email_domain_replacement }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          result = subprocess.run(
              ["terraform", "show", "-json", "foundation-bootstrap.tfplan"],
              check=False,
              capture_output=True,
              timeout=30,
          )
          if result.returncode != 0 or len(result.stdout) > 4_194_304 or len(result.stderr) > 65_536:
              raise SystemExit("foundation bootstrap plan is inaccessible or exceeds the fixed limit")
          try:
              plan = json.loads(result.stdout)
          except (TypeError, ValueError):
              raise SystemExit("foundation bootstrap plan is malformed") from None
          if not isinstance(plan, dict):
              raise SystemExit("foundation bootstrap plan is malformed")
          changes = plan.get("resource_changes", [])
          # The full non-workload foundation (resource group, VNet/subnets, Log
          # Analytics, ACR, Key Vault + ~25 runtime secrets, Postgres, Redis,
          # audit storage, ACS, workload identities and their per-secret role
          # assignments, plus private-mode endpoints/DNS) legitimately runs to a
          # few hundred resource changes. 384 keeps a tight ceiling against a
          # runaway plan while admitting a real foundation.
          if not isinstance(changes, list) or len(changes) > 384:
              raise SystemExit("foundation bootstrap plan change set is malformed or exceeds the fixed limit")
          destructive = sorted(
              change["address"]
              for change in changes
              if isinstance(change, dict) and "delete" in change.get("change", {}).get("actions", [])
          )
          # An explicit sending-domain rotation (allow_email_domain_replacement)
          # may replace ONLY the ACS email domain, its sender username, and its
          # verification DNS records. These hold no data and no dependent
          # workload state; every other destructive change stays blocked so a
          # rotation can never take down data, secrets, network, or the registry.
          allow_domain_replacement = (
              os.environ.get("KP_ALLOW_EMAIL_DOMAIN_REPLACEMENT", "false").strip().lower() == "true"
          )
          replaceable_on_domain_rotation = {
              "azurerm_email_communication_service_domain.main[0]",
              "azurerm_email_communication_service_domain_sender_username.main[0]",
              'azurerm_dns_txt_record.acs_verification["domain"]',
              'azurerm_dns_txt_record.acs_verification["spf"]',
              'azurerm_dns_cname_record.acs_verification["dkim"]',
              'azurerm_dns_cname_record.acs_verification["dkim2"]',
          }
          if allow_domain_replacement:
              unexpected = [address for address in destructive if address not in replaceable_on_domain_rotation]
              if unexpected:
                  raise SystemExit(
                      "sending-domain rotation may replace only the ACS email domain, its sender, "
                      f"and its verification DNS records; refusing other destructive changes: {unexpected}"
                  )
          elif destructive:
              raise SystemExit(
                  "foundation bootstrap is create/update-only and refuses deletes or replacements; "
                  "review the existing deployment before continuing"
              )
          changed = {
              change.get("address")
              for change in changes
              if isinstance(change, dict) and change.get("change", {}).get("actions") != ["no-op"]
          }
          if None in changed:
              raise SystemExit("foundation bootstrap plan contains an unidentified change")
          # Bootstrap the complete non-workload foundation. In particular ACR
          # and its private network path must exist before the workloads phase
          # can build and resolve immutable images. Targeting only ACS leaves a
          # fresh deployment in an unrecoverable ACR-before-create blind alley.
          forbidden = {
              "azurerm_communication_service_email_domain_association.main[0]",
              "azurerm_email_communication_service_domain_sender_username.main[0]",
          }
          if changed & forbidden:
              raise SystemExit("foundation bootstrap must not create an ACS association or sender username")
          PY
