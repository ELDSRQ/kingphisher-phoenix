name: Azure deployment

# Two supported shapes, chosen by `network_mode`:
#
#   starter  - data-plane services stay publicly reachable, so a GitHub-hosted
#              runner can deploy a brand-new tenant in a single dispatch with no
#              pre-existing VNet or self-hosted runner. For evaluation and first
#              bring-up only; Terraform refuses it for production.
#   private  - the hardened default. Postgres, Redis, Key Vault and the registry
#              sit behind private endpoints, so the deploy job must run on a
#              runner inside the VNet.
#
# Images are built with `az acr build` in both modes: the build happens inside
# the registry, so no runner needs a Docker daemon.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]
      network_mode:
        description: >-
          private = hardened (private endpoints, VNet runner required);
          starter = public endpoints, deployable from a hosted runner
        required: true
        default: private
        type: choice
        options: [private, starter]

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-packages
      - run: make lint
      - run: make typecheck
      - run: uv run pytest -q

  guard:
    # Cheap, explicit refusal before any Azure call. Terraform enforces this too
    # (terraform_data.network_mode_guard), but failing here keeps the reason
    # legible instead of surfacing as a plan error deep in the deploy job.
    runs-on: ubuntu-latest
    steps:
      - name: Refuse starter mode for production
        if: inputs.environment == 'production' && inputs.network_mode == 'starter'
        run: |
          echo "::error::network_mode=starter exposes Postgres, Redis, Key Vault and the registry"
          echo "::error::to the public internet and must not be used for production."
          echo "::error::Deploy production with network_mode=private."
          exit 1
      - name: Record selected mode
        run: echo "Deploying ${{ inputs.environment }} in ${{ inputs.network_mode }} network mode."

  deploy:
    needs: [qualify, guard]
    environment: ${{ inputs.environment }}
    # Starter mode reaches public endpoints, so a hosted runner suffices and a
    # new tenant needs no bootstrap VM. Private mode must run inside the VNet.
    runs-on: ${{ inputs.network_mode == 'starter' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","azure-vnet"]') }}
    env:
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_operator_fqdn: ${{ vars.OPERATOR_FQDN }}
      TF_VAR_tracking_fqdn: ${{ vars.TRACKING_FQDN }}
      TF_VAR_entra_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_entra_client_id: ${{ vars.ENTRA_APPLICATION_CLIENT_ID }}
      TF_VAR_ai_endpoint: ${{ vars.AI_GATEWAY_ENDPOINT }}
      TF_VAR_alert_webhook_domains: ${{ vars.ALERT_WEBHOOK_DOMAINS }}
      TF_VAR_allowed_recipient_domains: ${{ vars.ALLOWED_RECIPIENT_DOMAINS }}
      TF_VAR_network_mode: ${{ inputs.network_mode }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Initialize Terraform
        working-directory: infrastructure/terraform
        run: >-
          terraform init
          -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
          -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
          -backend-config="container_name=$TF_STATE_CONTAINER"
          -backend-config="key=${{ inputs.environment }}/kingphisher.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Provision foundation
        working-directory: infrastructure/terraform
        run: >-
          terraform apply -auto-approve
          -var-file="environments/${{ inputs.environment }}.tfvars"
          -var="deploy_workloads=false"
      - name: Build immutable images in the registry
        id: images
        shell: bash
        run: |
          set -euo pipefail
          registry="$(terraform -chdir=infrastructure/terraform output -raw container_registry_name)"
          login_server="$(terraform -chdir=infrastructure/terraform output -raw container_registry_login_server)"
          tag="sha-${GITHUB_SHA}"
          # `az acr build` uploads the context and builds inside ACR Tasks, so
          # the runner needs no Docker daemon in either network mode.
          for image in operator-api tracking-api worker migration; do
            az acr build \
              --registry "$registry" \
              --image "${image}:${tag}" \
              --file "infrastructure/containers/Dockerfile.${image}" \
              .
          done
          echo "registry=$login_server" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Plan workloads
        working-directory: infrastructure/terraform
        run: >-
          terraform plan -out=release.tfplan
          -var-file="environments/${{ inputs.environment }}.tfvars"
          -var="deploy_workloads=true"
          -var="operator_image=${{ steps.images.outputs.registry }}/operator-api:${{ steps.images.outputs.tag }}"
          -var="tracking_image=${{ steps.images.outputs.registry }}/tracking-api:${{ steps.images.outputs.tag }}"
          -var="worker_image=${{ steps.images.outputs.registry }}/worker:${{ steps.images.outputs.tag }}"
          -var="migration_image=${{ steps.images.outputs.registry }}/migration:${{ steps.images.outputs.tag }}"
      - name: Apply workloads
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve release.tfplan
      - name: Migrate and qualify
        shell: bash
        run: |
          export AZURE_RESOURCE_GROUP="$(terraform -chdir=infrastructure/terraform output -raw resource_group_name)"
          export AZURE_MIGRATION_JOB="$(terraform -chdir=infrastructure/terraform output -raw migration_job_name)"
          export AZURE_OPERATOR_URL="https://$(terraform -chdir=infrastructure/terraform output -raw operator_default_hostname)"
          export AZURE_TRACKING_URL="https://$(terraform -chdir=infrastructure/terraform output -raw tracking_default_hostname)"
          ./scripts/azure_release.sh
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "### KingPhisher-Phoenix deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Network mode | ${{ inputs.network_mode }} |"
            echo "| Image tag | sha-${GITHUB_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.network_mode }}" = "starter" ]; then
            echo "> Starter mode: data-plane services are publicly reachable. Re-deploy with network_mode=private before holding real recipient data." >> "$GITHUB_STEP_SUMMARY"
          fi
