      - name: Qualify every managed worker role
        if: inputs.deployment_phase == 'workloads'
        env:
          KP_WORKER_HEALTH_TIMEOUT_SECONDS: 600
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time

          APP_NAME = re.compile(r"[a-z][a-z0-9-]{1,31}\Z")
          REVISION_NAME = re.compile(r"[a-z0-9][a-z0-9-]{1,63}\Z")
          ROLE_NAME = re.compile(r"[a-z][a-z-]{0,31}\Z")
          UUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\Z", re.I)
          MAX_RESPONSE_BYTES = 65_536

          def fail(message):
              raise SystemExit(message)

          def run(command, label):
              try:
                  result = subprocess.run(command, check=False, capture_output=True, timeout=60)
              except (OSError, subprocess.TimeoutExpired):
                  fail(f"{label} was inaccessible")
              if result.returncode != 0:
                  fail(f"{label} was missing, ambiguous, or inaccessible")
              if len(result.stdout) > MAX_RESPONSE_BYTES:
                  fail(f"{label} exceeded the fixed response limit")
              return result.stdout.decode("utf-8")

          def run_json(command, label):
              try:
                  return json.loads(run(command, label))
              except (UnicodeDecodeError, ValueError):
                  fail(f"{label} returned malformed JSON")

          resource_group = run(
              ["terraform", "-chdir=infrastructure/terraform", "output", "-raw", "resource_group_name"],
              "resource-group output",
          ).strip()
          workspace = run(
              [
                  "terraform", "-chdir=infrastructure/terraform", "output", "-raw",
                  "log_analytics_workspace_customer_id",
              ],
              "Log Analytics workspace output",
          ).strip()
          targets = run_json(
              [
                  "terraform", "-chdir=infrastructure/terraform", "output", "-json",
                  "managed_worker_health_targets",
              ],
              "managed worker target output",
          )
          if not re.fullmatch(r"[A-Za-z0-9._()-]{1,90}", resource_group) or UUID.fullmatch(workspace) is None:
              fail("managed worker health output identities were invalid")
          if not isinstance(targets, dict) or not targets or len(targets) > 2:
              fail("managed worker health target inventory was empty or invalid")

          expected = {}
          revisions = {}

          def healthy_revision(app_name):
              inventory = run_json(
                  [
                      "az", "containerapp", "revision", "list", "--resource-group", resource_group,
                      "--name", app_name, "--query",
                      "[?properties.active].{name:name,healthState:properties.healthState,provisioningState:properties.provisioningState}",
                      "-o", "json",
                  ],
                  f"active revision inventory for {app_name}",
              )
              if not isinstance(inventory, list) or len(inventory) != 1 or not isinstance(inventory[0], dict):
                  fail(f"{app_name} did not have exactly one active worker revision")
              revision = inventory[0]
              revision_name = revision.get("name")
              if (
                  not isinstance(revision_name, str)
                  or REVISION_NAME.fullmatch(revision_name) is None
                  or str(revision.get("healthState", "")).lower() != "healthy"
                  or str(revision.get("provisioningState", "")).lower() != "provisioned"
              ):
                  fail(f"{app_name} active worker revision was not healthy and provisioned")
              return revision_name

          for app_name, target in targets.items():
              roles = target.get("roles") if isinstance(target, dict) else None
              if (
                  not isinstance(app_name, str)
                  or APP_NAME.fullmatch(app_name) is None
                  or not isinstance(roles, list)
                  or not roles
                  or len(roles) > 9
                  or any(not isinstance(role, str) or ROLE_NAME.fullmatch(role) is None for role in roles)
                  or len(set(roles)) != len(roles)
              ):
                  fail("managed worker health target inventory was malformed")
              expected[app_name] = set(roles)
              revisions[app_name] = healthy_revision(app_name)

          deadline = time.monotonic() + int(os.environ["KP_WORKER_HEALTH_TIMEOUT_SECONDS"])
          all_targets = {(app_name, role) for app_name, roles in expected.items() for role in roles}
          pending = set(all_targets)
          stable_passes = 0
          while stable_passes < 2 and time.monotonic() < deadline:
              observed = {}
              for app_name, roles in expected.items():
                  revision_name = revisions[app_name]
                  query = f'''ContainerAppConsoleLogs_CL
          | where TimeGenerated > ago(1h)
          | where ContainerAppName_s == "{app_name}" and RevisionName_s == "{revision_name}"
          | extend payload = parse_json(Log_s)
          | where tostring(payload.event) == "worker_role_readiness"
          | extend role = tostring(payload.role), ready = tobool(payload.ready), reason = tostring(payload.reason)
          | summarize arg_max(TimeGenerated, ready, reason) by role
          | project role, ready, reason, observed_at=TimeGenerated'''
                  rows = run_json(
                      [
                          "az", "monitor", "log-analytics", "query", "--workspace", workspace,
                          "--analytics-query", query, "--timespan", "PT1H", "-o", "json",
                      ],
                      f"worker readiness telemetry for {app_name}",
                  )
                  if not isinstance(rows, list) or len(rows) > 16:
                      fail(f"worker readiness telemetry for {app_name} was malformed")
                  for row in rows:
                      if not isinstance(row, dict):
                          fail(f"worker readiness telemetry for {app_name} was malformed")
                      role = row.get("role")
                      ready = row.get("ready")
                      if role in roles and isinstance(ready, bool):
                          observed[(app_name, role)] = ready
              # Re-evaluate every role on every pass so an earlier success
              # cannot mask a newer not-ready event while another role waits.
              pending = {target for target in all_targets if observed.get(target) is not True}
              stable_passes = 0 if pending else stable_passes + 1
              if stable_passes < 2:
                  time.sleep(10)

          if pending or stable_passes < 2:
              labels = ", ".join(f"{app_name}/{role}" for app_name, role in sorted(pending))
              labels = labels or "stable simultaneous confirmation"
              fail(f"managed worker role readiness was not confirmed for: {labels}")
          for app_name, revision_name in revisions.items():
              if healthy_revision(app_name) != revision_name:
                  fail(f"{app_name} active worker revision changed during health qualification")
          print(f"managed worker readiness confirmed for {sum(len(roles) for roles in expected.values())} roles")
          PY
      - name: Checkpoint migration and health qualification
        if: inputs.deployment_phase == 'workloads'
        env:
          KP_MIGRATION_RESULT: passed
          KP_HEALTH_RESULT: passed
        run: python3 "$KP_CHECKPOINT_HELPER" --stage migration_health_passed --status passed
      - name: Plan ACS receipt subscription activation
        if: inputs.deployment_phase == 'workloads'
        env:
          IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
          MIGRATION_DIGEST: ${{ steps.images.outputs.migration_digest }}
          OPERATOR_API_DIGEST: ${{ steps.images.outputs.operator_api_digest }}
