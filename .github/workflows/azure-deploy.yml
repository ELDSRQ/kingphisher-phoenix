          result = subprocess.run(
              ["terraform", "show", "-json", "release.tfplan"],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(result.stdout)
          destructive = sorted(
              change["address"]
              for change in plan.get("resource_changes", [])
              if "delete" in change.get("change", {}).get("actions", [])
