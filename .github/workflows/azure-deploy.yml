        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/supply-chain"
          source_date_epoch="$(git show --no-patch --format=%ct "$GITHUB_SHA")"
          while IFS=$'\t' read -r image repository digest sbom_name; do
            raw_sbom="${evidence_dir}/${image}.raw.spdx.json"
            "$SYFT_COMMAND" "registry:${repository}@${digest}" \
              --scope all-layers \
              --output "spdx-json=${raw_sbom}"
            python scripts/operator/release/supply_chain_evidence.py canonicalize-sbom \
              --input "$raw_sbom" \
