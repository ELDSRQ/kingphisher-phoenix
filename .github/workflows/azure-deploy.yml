      - name: Initiate pending ACS customer-domain verification
        if: inputs.deployment_phase == 'foundation_bootstrap'
        env:
          PROTECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PROTECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          API_VERSION = "2023-04-01"
          VERIFICATION_TYPES = ("Domain", "SPF", "DKIM", "DKIM2")
          MAX_CONTROL_PLANE_BYTES = 32_768
          UUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\Z", re.I)
          DOMAIN = re.compile(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\Z")
          RESOURCE_GROUP = re.compile(r"[A-Za-z0-9_.()\-]{1,90}\Z")
          EMAIL_SERVICE = re.compile(r"[A-Za-z0-9-]{1,63}\Z")

          def fail(message):
              raise SystemExit(message)

          def run_bounded(command, label, *, timeout=30, max_bytes=MAX_CONTROL_PLANE_BYTES):
              try:
                  result = subprocess.run(
                      command,
                      check=False,
                      capture_output=True,
                      timeout=timeout,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail(f"{label} is inaccessible")
              if len(result.stdout) > max_bytes or len(result.stderr) > max_bytes:
                  fail(f"{label} exceeded the fixed output limit")
              return result

          def run_json(command, label, *, max_bytes=MAX_CONTROL_PLANE_BYTES):
              result = run_bounded(command, label, max_bytes=max_bytes)
              if result.returncode != 0:
                  # Provider bodies may contain operational details. Never
                  # reproduce stdout or stderr in workflow logs or evidence.
                  fail(f"{label} is missing, ambiguous, or inaccessible")
              try:
                  value = json.loads(result.stdout)
              except (TypeError, ValueError):
                  fail(f"{label} returned malformed JSON")
              return value

          def terraform_output(name):
              return run_json(
                  ["terraform", "-chdir=infrastructure/terraform", "output", "-json", name],
                  f"Terraform output {name}",
                  max_bytes=65_536,
              )

          def split_domain_id(resource_id, subscription_id):
              if not isinstance(resource_id, str) or len(resource_id) > 2_048 or any(
                  marker in resource_id for marker in ("?", "#", "\n", "\r")
              ):
                  fail("ACS email-domain resource ID is malformed")
              segments = resource_id.strip("/").split("/")
              if len(segments) != 10 or any(not segment for segment in segments):
                  fail("ACS email-domain resource ID is malformed")
              if (
                  segments[0].lower() != "subscriptions"
                  or UUID.fullmatch(segments[1]) is None
                  or segments[1].lower() != subscription_id
                  or segments[2].lower() != "resourcegroups"
                  or RESOURCE_GROUP.fullmatch(segments[3]) is None
                  or segments[4].lower() != "providers"
                  or segments[5].lower() != "microsoft.communication"
                  or segments[6].lower() != "emailservices"
                  or EMAIL_SERVICE.fullmatch(segments[7]) is None
                  or segments[8].lower() != "domains"
                  or DOMAIN.fullmatch(segments[9].lower()) is None
              ):
                  fail("ACS email-domain resource ID is malformed or outside the protected subscription")
              return segments

          def validate_dns_guidance(value, sending_domain):
              if not isinstance(value, dict):
                  fail("ACS DNS guidance is malformed")
              if value.get("resource_mode") != "provision" or value.get("sending_domain") != sending_domain:
                  fail("ACS DNS guidance does not match the reviewed provisioned domain")
              automation = value.get("dns_automation")
              status = value.get("dns_status")
              if not isinstance(automation, bool) or status not in {
                  "azure_dns_records_managed_verification_pending", "manual_dns_required"
              }:
                  fail("ACS DNS guidance has an invalid publication status")
              expected_status = (
                  "azure_dns_records_managed_verification_pending" if automation else "manual_dns_required"
              )
              if status != expected_status:
                  fail("ACS DNS guidance publication status is inconsistent")
              records = value.get("dns_records")
              if not isinstance(records, list) or len(records) != 4:
                  fail("ACS DNS guidance must contain exactly four verification records")
              expected_types = {"domain": "TXT", "spf": "TXT", "dkim": "CNAME", "dkim2": "CNAME"}
              observed = {}
              for record in records:
                  if not isinstance(record, dict) or set(record) != {"purpose", "name", "type", "value", "ttl"}:
                      fail("ACS DNS guidance record is malformed")
                  purpose = record.get("purpose")
                  if purpose not in expected_types or purpose in observed:
                      fail("ACS DNS guidance record purpose is invalid or duplicated")
                  if record.get("type") != expected_types[purpose]:
                      fail("ACS DNS guidance record type is invalid")
                  if not isinstance(record.get("ttl"), int) or not 60 <= record["ttl"] <= 86_400:
                      fail("ACS DNS guidance record TTL is invalid")
                  for field in ("name", "value"):
                      item = record.get(field)
                      if not isinstance(item, str) or not item or len(item) > 2_048 or "\n" in item or "\r" in item:
                          fail("ACS DNS guidance record value is invalid")
                  observed[purpose] = True
              if set(observed) != set(expected_types):
                  fail("ACS DNS guidance record set is incomplete")
              return status

          def post_verification(domain_id, verification_type):
              if VERIFICATION_TYPES != ("Domain", "SPF", "DKIM", "DKIM2"):
                  fail("ACS verification type allowlist is invalid")
              body = {"verificationType": verification_type}
              if set(body) != {"verificationType"} or body["verificationType"] not in VERIFICATION_TYPES:
                  fail("ACS verification request body is outside the fixed allowlist")
              serialized = json.dumps(body, separators=(",", ":"), sort_keys=True)
              if json.loads(serialized) != body or len(serialized.encode("utf-8")) > 64:
                  fail("ACS verification request body is invalid")
              uri = (
                  f"https://management.azure.com{domain_id}/initiateVerification"
                  f"?api-version={API_VERSION}"
              )
              result = run_bounded(
                  [
                      "az", "rest", "--method", "post", "--uri", uri,
                      "--headers", "Content-Type=application/json", "--body", serialized,
                      "--output", "none", "--only-show-errors",
                  ],
                  f"ACS {verification_type} verification initiation",
              )
              if result.returncode != 0:
                  # The stable API documents 202 Accepted. On retries, an
                  # already-started request is treated as accepted only when
                  # the authenticated client reports success; no provider
                  # error is inferred to be idempotent from an untrusted body.
                  fail(f"ACS {verification_type} verification initiation was not accepted")

          if os.environ.get("DEPLOYMENT_PHASE") != "foundation_bootstrap":
              fail("ACS verification initiation is restricted to foundation_bootstrap")
          subscription_id = os.environ.get("PROTECTED_SUBSCRIPTION_ID", "").lower()
          tenant_id = os.environ.get("PROTECTED_TENANT_ID", "").lower()
          if UUID.fullmatch(subscription_id) is None or UUID.fullmatch(tenant_id) is None:
              fail("protected Azure identity is malformed")
          reviewed_digest = os.environ.get("KP_REVIEWED_DEPLOYMENT_DIGEST", "")
          reviewed_commit = os.environ.get("REVIEWED_COMMIT_SHA", "")
          request_id = os.environ.get("DEPLOYMENT_REQUEST_ID", "")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", reviewed_digest) is None:
              fail("reviewed deployment digest is missing or malformed")
          if re.fullmatch(r"[0-9a-f]{40}", reviewed_commit) is None:
              fail("reviewed commit is malformed")
          if re.fullmatch(r"kp-[0-9a-f]{32}-[1-9][0-9]{0,2}", request_id) is None:
              fail("deployment request correlation is malformed")

          account = run_json(
              [
                  "az", "account", "show", "--query", "{subscriptionId:id,tenantId:tenantId}",
                  "--output", "json", "--only-show-errors",
              ],
              "authenticated Azure account",
              max_bytes=4_096,
          )
          if not isinstance(account, dict) or str(account.get("subscriptionId", "")).lower() != subscription_id:
              fail("authenticated Azure subscription does not match the reviewed deployment")
          if str(account.get("tenantId", "")).lower() != tenant_id:
              fail("authenticated Azure tenant does not match the reviewed deployment")

          config_path = Path(os.environ["RUNNER_TEMP"]) / "reviewed.auto.tfvars.json"
          if not config_path.is_file() or config_path.stat().st_size > 32_768:
              fail("reviewed deployment configuration is missing or exceeds the fixed limit")
          try:
              config = json.loads(config_path.read_text(encoding="utf-8"))
          except (OSError, TypeError, ValueError):
              fail("reviewed deployment configuration is malformed")
          if not isinstance(config, dict) or config.get("acs_resource_mode") not in {"existing", "provision"}:
              fail("reviewed ACS resource mode is invalid")

          resources = terraform_output("acs_control_plane_resources")
          if not isinstance(resources, dict) or set(resources) != {
              "resource_group_name", "communication_service_id", "email_domain_id", "sender_username_id"
          }:
              fail("stored ACS control-plane resource identities are malformed")
          domain_id = resources.get("email_domain_id")
          domain_parts = split_domain_id(domain_id, subscription_id)
          if str(resources.get("resource_group_name", "")).lower() != domain_parts[3].lower():
              fail("stored ACS email domain does not belong to the Terraform resource group")
          sending_domain = str(config.get("acs_sending_domain", "")).strip().lower()
          if DOMAIN.fullmatch(sending_domain) is None or domain_parts[9].lower() != sending_domain:
              fail("stored ACS email domain does not match the reviewed sending domain")

          mode = config["acs_resource_mode"]
          initiated = []
          dns_status = "existing_domain_dns_external"
          result_name = "not_applicable_existing_resource_no_mutation"
          verification_state = "existing_resource_not_mutated"
          if mode == "existing":
              if str(config.get("acs_existing_email_domain_id", "")).lower() != domain_id.lower():
                  fail("stored ACS email domain does not match the reviewed existing resource ID")
          else:
              dns_status = validate_dns_guidance(terraform_output("acs_delivery_readiness"), sending_domain)
              prior_states = [
                  config.get(key)
                  for key in (
                      "acs_domain_verification_status", "acs_spf_verification_status",
                      "acs_dkim_verification_status", "acs_dkim2_verification_status",
                  )
              ]
              if any(
                  not isinstance(state, str) or not state or len(state) > 64 or "\n" in state or "\r" in state
                  for state in prior_states
              ):
                  fail("authenticated ACS verification readback is malformed")
              if all(state.lower() == "verified" for state in prior_states):
                  # The earlier authenticated GET already established this
                  # fact. Do not restart completed verification or mutate the
                  # status fields; the workload gate still owns promotion.
                  result_name = "already_verified_by_authenticated_readback_no_mutation"
                  verification_state = "verified_by_prior_authenticated_control_plane_readback"
              else:
                  for verification_type in VERIFICATION_TYPES:
                      post_verification(domain_id, verification_type)
                      initiated.append(verification_type)
                  result_name = "accepted_pending_control_plane_verification"
                  verification_state = "pending_external_dns_and_control_plane_readback"

          recorded_at = datetime.now(UTC).isoformat().replace("+00:00", "Z")
          evidence = {
              "schema": "kp.acs-verification-initiation.v1",
              "recorded_at": recorded_at,
              "result": result_name,
              "phase": "foundation_bootstrap",
              "resource_mode": mode,
              "subscription_id": subscription_id,
              "tenant_id": tenant_id,
              "email_domain_id": domain_id,
              "api_version": API_VERSION,
              "verification_types": initiated,
              "verification_state": verification_state,
              "dns_guidance_status": dns_status,
              "reviewed_commit_sha": reviewed_commit,
              "reviewed_deployment_digest": reviewed_digest,
              "deployment_request_id": request_id,
              "workflow_run": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "scope_limits": {
                  "provider_response_body_recorded": False,
                  "verification_marked_complete": False,
                  "workloads_unlocked": False,
                  "repeat_foundation_dispatch_may_be_required": True,
              },
          }
          canonical = json.dumps(evidence, separators=(",", ":"), sort_keys=True)
          if len(canonical.encode("utf-8")) > 16_384:
              fail("ACS verification initiation evidence exceeds the fixed limit")
          evidence_digest = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          evidence["evidence_digest"] = evidence_digest
          evidence_path = (
              Path(os.environ["RUNNER_TEMP"]) / "deployment-evidence" / "acs-verification-initiation.json"
          )
          with evidence_path.open("x", encoding="utf-8") as output:
              output.write(json.dumps(evidence, separators=(",", ":"), sort_keys=True) + "\n")
              output.flush()
              os.fsync(output.fileno())
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"KP_ACS_VERIFICATION_INITIATION_DIGEST={evidence_digest}\n")
          PY
      - name: Checkpoint ACS verification initiation
        if: inputs.deployment_phase == 'foundation_bootstrap'
        env:
          KP_MIGRATION_RESULT: not_applicable
          KP_HEALTH_RESULT: not_applicable
        run: python3 "$KP_CHECKPOINT_HELPER" --stage acs_verification_initiated --status passed
      - name: Plan ACS foundation finalize
        if: inputs.deployment_phase == 'foundation_finalize'
        working-directory: infrastructure/terraform
        run: >-
          terraform plan -out=foundation-finalize.tfplan
          -var-file="environments/$DEPLOYMENT_ENVIRONMENT.tfvars"
          -var-file="$RUNNER_TEMP/reviewed.auto.tfvars.json"
          -var="environment=$DEPLOYMENT_ENVIRONMENT"
          -var="network_mode=$DEPLOYMENT_NETWORK_MODE"
          -var="deploy_workloads=false"
          -var="acs_deployment_stage=foundation_finalize"
          -target=azurerm_communication_service_email_domain_association.main
          -target=azurerm_email_communication_service_domain_sender_username.main
      - name: Enforce ACS foundation finalize plan allowlist
        if: inputs.deployment_phase == 'foundation_finalize'
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["terraform", "show", "-json", "foundation-finalize.tfplan"],
              check=False,
              capture_output=True,
              timeout=30,
          )
          if result.returncode != 0 or len(result.stdout) > 4_194_304 or len(result.stderr) > 65_536:
              raise SystemExit("foundation finalize plan is inaccessible or exceeds the fixed limit")
          try:
              plan = json.loads(result.stdout)
          except (TypeError, ValueError):
              raise SystemExit("foundation finalize plan is malformed") from None
          if not isinstance(plan, dict):
              raise SystemExit("foundation finalize plan is malformed")
          changes = plan.get("resource_changes", [])
          if not isinstance(changes, list) or len(changes) > 64:
              raise SystemExit("foundation finalize plan change set is malformed or exceeds the fixed limit")
          destructive = sorted(
              change["address"]
              for change in changes
              if isinstance(change, dict) and "delete" in change.get("change", {}).get("actions", [])
          )
          if destructive:
              raise SystemExit(
                  "foundation finalize is create/update-only and refuses deletes or replacements; "
                  "review the existing deployment before continuing"
              )
          changed = {
              change.get("address")
              for change in changes
              if isinstance(change, dict) and change.get("change", {}).get("actions") != ["no-op"]
          }
          if None in changed:
              raise SystemExit("foundation finalize plan contains an unidentified change")
          allowed = {
              "azurerm_communication_service_email_domain_association.main[0]",
              "azurerm_email_communication_service_domain_sender_username.main[0]",
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"foundation finalize plan contains unrelated changes: {sorted(unexpected)}")
          PY
      - name: Checkpoint allowlisted foundation finalize plan
        if: inputs.deployment_phase == 'foundation_finalize'
        run: python3 "$KP_CHECKPOINT_HELPER" --stage foundation_finalize_plan_safe --status passed
      - name: Apply ACS foundation finalize
        if: inputs.deployment_phase == 'foundation_finalize'
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve foundation-finalize.tfplan
      - name: Checkpoint ACS foundation finalize apply
        if: inputs.deployment_phase == 'foundation_finalize'
        run: python3 "$KP_CHECKPOINT_HELPER" --stage foundation_finalize_applied --status passed
      - name: Prove finalized ACS association and sender from Azure
        if: inputs.deployment_phase == 'foundation_finalize'
        env:
          PROTECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          PROTECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          API_VERSION = "2023-04-01"
          MAX_CONTROL_PLANE_BYTES = 65_536
          UUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\Z", re.I)
          DOMAIN = re.compile(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\Z")
          SENDER = re.compile(r"[a-z0-9][a-z0-9._+-]{0,63}\Z")

          def fail(message):
              raise SystemExit(message)

          def run_json(command, label, *, max_bytes=MAX_CONTROL_PLANE_BYTES):
              try:
                  result = subprocess.run(
                      command,
                      check=False,
                      capture_output=True,
                      timeout=45,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail(f"{label} is inaccessible")
              if len(result.stdout) > max_bytes or len(result.stderr) > max_bytes:
                  fail(f"{label} exceeds the fixed response limit")
              if result.returncode != 0:
                  # Provider response bodies remain private to the bounded
                  # subprocess and are never copied to logs or evidence.
                  fail(f"{label} is missing, ambiguous, or inaccessible")
              try:
                  return json.loads(result.stdout)
              except (TypeError, ValueError):
                  fail(f"{label} returned malformed JSON")

          def az_get(resource_id, query):
              return run_json(
                  [
                      "az", "rest", "--method", "get", "--uri",
                      f"https://management.azure.com{resource_id}?api-version={API_VERSION}",
                      "--query", query, "--output", "json", "--only-show-errors",
                  ],
                  "selected finalized ACS control-plane resource",
              )

          def split_resource_id(resource_id, expected_segments, label, subscription_id):
              if not isinstance(resource_id, str) or len(resource_id) > 2_048 or any(
                  marker in resource_id for marker in ("?", "#", "\n", "\r")
              ):
                  fail(f"{label} resource ID is malformed")
              segments = resource_id.strip("/").split("/")
              if len(segments) != expected_segments or any(not segment for segment in segments):
                  fail(f"{label} resource ID is malformed")
              if (
                  segments[0].lower() != "subscriptions"
                  or UUID.fullmatch(segments[1]) is None
                  or segments[1].lower() != subscription_id
                  or segments[2].lower() != "resourcegroups"
                  or segments[4].lower() != "providers"
                  or segments[5].lower() != "microsoft.communication"
              ):
                  fail(f"{label} resource ID is malformed or outside the protected subscription")
              return segments

          def require_identity(value, resource_id, resource_type, label):
              if not isinstance(value, dict):
                  fail(f"{label} selected fields are malformed")
              if str(value.get("id", "")).lower() != resource_id.lower():
                  fail(f"{label} readback does not match the stored resource ID")
              if str(value.get("type", "")).lower() != resource_type.lower():
                  fail(f"{label} readback has an unexpected resource type")

          def require_ready(value, label, *, optional=False):
              state = value.get("provisioningState") if isinstance(value, dict) else None
              if optional and state is None:
                  return
              if not isinstance(state, str) or state.lower() not in {"running", "succeeded"}:
                  fail(f"{label} is not in a ready provisioning state")

          if os.environ.get("DEPLOYMENT_PHASE") != "foundation_finalize":
              fail("finalized ACS readback is restricted to foundation_finalize")
          subscription_id = os.environ.get("PROTECTED_SUBSCRIPTION_ID", "").lower()
          tenant_id = os.environ.get("PROTECTED_TENANT_ID", "").lower()
          if UUID.fullmatch(subscription_id) is None or UUID.fullmatch(tenant_id) is None:
              fail("protected Azure identity is malformed")
          account = run_json(
              [
                  "az", "account", "show", "--query", "{subscriptionId:id,tenantId:tenantId}",
                  "--output", "json", "--only-show-errors",
              ],
              "authenticated Azure account",
              max_bytes=4_096,
          )
          if not isinstance(account, dict) or str(account.get("subscriptionId", "")).lower() != subscription_id:
              fail("authenticated Azure subscription does not match the reviewed deployment")
          if str(account.get("tenantId", "")).lower() != tenant_id:
              fail("authenticated Azure tenant does not match the reviewed deployment")

          config_path = Path(os.environ["RUNNER_TEMP"]) / "reviewed.auto.tfvars.json"
          if not config_path.is_file() or config_path.stat().st_size > 32_768:
              fail("reviewed deployment configuration is missing or exceeds the fixed limit")
          try:
              config = json.loads(config_path.read_text(encoding="utf-8"))
          except (OSError, TypeError, ValueError):
              fail("reviewed deployment configuration is malformed")
          if not isinstance(config, dict):
              fail("reviewed deployment configuration is malformed")
          resources = run_json(
              [
                  "terraform", "-chdir=infrastructure/terraform", "output", "-json",
                  "acs_control_plane_resources",
              ],
              "stored ACS control-plane resources",
          )
          if not isinstance(resources, dict) or set(resources) != {
              "resource_group_name", "communication_service_id", "email_domain_id", "sender_username_id"
          }:
              fail("stored ACS control-plane resource identities are malformed")
          communication_id = resources["communication_service_id"]
          domain_id = resources["email_domain_id"]
          sender_id = resources["sender_username_id"]
          communication_parts = split_resource_id(communication_id, 8, "Communication Service", subscription_id)
          domain_parts = split_resource_id(domain_id, 10, "email domain", subscription_id)
          sender_parts = split_resource_id(sender_id, 12, "sender username", subscription_id)
          if communication_parts[6].lower() != "communicationservices":
              fail("Communication Service resource ID is malformed")
          if domain_parts[6].lower() != "emailservices" or domain_parts[8].lower() != "domains":
              fail("email domain resource ID is malformed")
          if sender_parts[:10] != domain_parts or sender_parts[10].lower() != "senderusernames":
              fail("sender username resource ID does not belong to the stored email domain")
          resource_group = str(resources["resource_group_name"])
          if any(parts[3].lower() != resource_group.lower() for parts in (communication_parts, domain_parts)):
              fail("stored ACS resources do not belong to the Terraform resource group")
          sending_domain = str(config.get("acs_sending_domain", "")).strip().lower()
          sender_local_part = str(config.get("acs_sender_local_part", "")).strip().lower()
          if DOMAIN.fullmatch(sending_domain) is None or domain_parts[9].lower() != sending_domain:
              fail("stored ACS email domain does not match the reviewed sending domain")
          if SENDER.fullmatch(sender_local_part) is None or sender_parts[11].lower() != sender_local_part:
              fail("stored sender username does not match the reviewed local part")

          communication = az_get(
              communication_id,
              "{id:id,type:type,provisioningState:properties.provisioningState,linkedDomains:properties.linkedDomains,dataLocation:properties.dataLocation}",
          )
          domain = az_get(
              domain_id,
              "{id:id,type:type,provisioningState:properties.provisioningState,fromSenderDomain:properties.fromSenderDomain,Domain:properties.verificationStates.Domain.status,SPF:properties.verificationStates.SPF.status,DKIM:properties.verificationStates.DKIM.status,DKIM2:properties.verificationStates.DKIM2.status,dataLocation:properties.dataLocation}",
          )
          sender = az_get(
              sender_id,
              "{id:id,type:type,provisioningState:properties.provisioningState,username:properties.username,displayName:properties.displayName,dataLocation:properties.dataLocation}",
          )
          require_identity(
              communication, communication_id,
              "Microsoft.Communication/CommunicationServices", "Communication Service",
          )
          require_identity(
              domain, domain_id, "Microsoft.Communication/EmailServices/Domains", "email domain",
          )
          require_identity(
              sender, sender_id,
              "Microsoft.Communication/EmailServices/Domains/SenderUsernames", "sender username",
          )
          require_ready(communication, "Communication Service")
          require_ready(domain, "email domain")
          require_ready(sender, "sender username", optional=True)
          statuses = {key: str(domain.get(key, "")).lower() for key in ("Domain", "SPF", "DKIM", "DKIM2")}
          if any(status != "verified" for status in statuses.values()):
              fail("foundation finalize requires all four live ACS verification states to remain Verified")
          if str(domain.get("fromSenderDomain", "")).lower() != sending_domain:
              fail("live email domain does not match the reviewed sending domain")
          linked_domains = communication.get("linkedDomains")
          if not isinstance(linked_domains, list) or len(linked_domains) > 64 or any(
              not isinstance(value, str) for value in linked_domains
          ):
              fail("Communication Service domain associations are malformed or ambiguous")
          if sum(value.lower() == domain_id.lower() for value in linked_domains) != 1:
              fail("foundation finalize requires the exact live ACS email-domain association")
          if str(sender.get("username", "")).lower() != sender_local_part:
              fail("live sender username does not match the reviewed local part")
          if str(sender.get("displayName", "")) != str(config.get("acs_sender_display_name", "")).strip():
              fail("live sender display name does not match the reviewed deployment")
          # Azure returns dataLocation in the compact enum form ("UnitedStates")
          # while the reviewed config uses the spaced form ("United States");
          # compare with all whitespace removed so the two spellings match.
          def _norm_location(raw):
              return "".join(str(raw).split()).lower()
          expected_location = _norm_location(config.get("communication_data_location", ""))
          if not expected_location or any(
              _norm_location(value.get("dataLocation", "")) != expected_location
              for value in (communication, domain)
          ):
              fail("live ACS parent data locations differ from the reviewed deployment")
          if sender.get("dataLocation") is not None and (
              _norm_location(sender["dataLocation"]) != expected_location
          ):
              fail("live sender data location differs from the reviewed deployment")

          evidence = {
              "schema": "kp.acs-finalize-readback.v1",
              "recorded_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "result": "foundation_finalized",
              "phase": "foundation_finalize",
              "subscription_id": subscription_id,
              "tenant_id": tenant_id,
              "resource_ids": {
                  "communication_service_id": communication_id,
                  "email_domain_id": domain_id,
                  "sender_username_id": sender_id,
              },
              "verification": {key.lower(): "verified" for key in statuses},
              "association": "verified_exact_single_match",
              "sender": "verified_exact_readback",
              "reviewed_commit_sha": os.environ["REVIEWED_COMMIT_SHA"],
              "reviewed_deployment_digest": os.environ["KP_REVIEWED_DEPLOYMENT_DIGEST"],
              "workflow_run": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "scope_limits": {
                  "workloads_deployed": False,
                  "mail_delivery_proven": False,
                  "inbox_placement_proven": False,
                  "human_mailbox_validation_proven": False,
              },
          }
          canonical = json.dumps(evidence, separators=(",", ":"), sort_keys=True)
          if len(canonical.encode("utf-8")) > 16_384:
              fail("finalized ACS readback evidence exceeds the fixed limit")
          digest = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          evidence["evidence_digest"] = digest
          target = Path(os.environ["RUNNER_TEMP"]) / "deployment-evidence" / "acs-finalize-readback.json"
          with target.open("x", encoding="utf-8") as output:
              output.write(json.dumps(evidence, separators=(",", ":"), sort_keys=True) + "\n")
              output.flush()
              os.fsync(output.fileno())
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"KP_ACS_FINALIZE_READBACK_DIGEST={digest}\n")
          PY
      - name: Checkpoint finalized ACS readback
        if: inputs.deployment_phase == 'foundation_finalize'
        env:
          KP_MIGRATION_RESULT: not_applicable
          KP_HEALTH_RESULT: not_applicable
        run: python3 "$KP_CHECKPOINT_HELPER" --stage foundation_finalize_readback --status passed
      - name: Build immutable images in the registry
        if: inputs.deployment_phase == 'workloads'
        id: images
        shell: bash
        run: |
          set -euo pipefail
          registry="$(terraform -chdir=infrastructure/terraform output -raw container_registry_name)"
          login_server="$(terraform -chdir=infrastructure/terraform output -raw container_registry_login_server)"
          # A per-attempt tag prevents a parallel environment or manual rerun
          # from moving the lookup target between the build and digest capture.
          # Tags are discovery handles only; every later consumer uses @sha256.
          tag="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # `az acr build` uploads the context and builds inside ACR Tasks, so
          # the runner needs no Docker daemon in either network mode.
          mkdir -p "$RUNNER_TEMP/supply-chain"
          : > "$RUNNER_TEMP/supply-chain/images.tsv"
          for image in operator-api tracking-api worker migration ai-gateway; do
            az acr build \
              --registry "$registry" \
              --image "${image}:${tag}" \
              --file "infrastructure/containers/Dockerfile.${image}" \
              --platform linux/amd64 \
              .
            digest="$(az acr repository show \
              --name "$registry" \
              --image "${image}:${tag}" \
              --query digest \
              --output tsv)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::ACR returned an invalid digest for ${image}: ${digest}"
              exit 1
            fi
            immutable_digest="$(az acr repository show \
              --name "$registry" \
              --image "${image}@${digest}" \
              --query digest \
              --output tsv)"
            if [[ "$immutable_digest" != "$digest" ]]; then
              echo "::error::ACR did not resolve the immutable digest for ${image}"
              exit 1
            fi
            output_name="${image//-/_}_digest"
            echo "${output_name}=${digest}" >> "$GITHUB_OUTPUT"
            printf '%s\t%s\t%s\t%s\n' \
              "$image" "${login_server}/${image}" "$digest" "${image}.spdx.json" \
              >> "$RUNNER_TEMP/supply-chain/images.tsv"
          done
          echo "registry=$login_server" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Authenticate supply-chain tools to ACR
        if: inputs.deployment_phase == 'workloads'
        env:
          IMAGE_REGISTRY: ${{ steps.images.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          registry="$(terraform -chdir=infrastructure/terraform output -raw container_registry_name)"
          login_server="$IMAGE_REGISTRY"
          access_token="$(az acr login --name "$registry" --expose-token --query accessToken --output tsv)"
          echo "::add-mask::$access_token"
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          chmod 700 "$docker_config"
          encoded="$(printf '%s' "00000000-0000-0000-0000-000000000000:${access_token}" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$login_server" "$encoded" > "$docker_config/config.json"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - name: Scan exact immutable registry images
        if: inputs.deployment_phase == 'workloads'
        shell: bash
        run: |
          set -euo pipefail
          trivy_version="$(trivy --version | awk '$1 == "Version:" { print $2; exit }')"
          if [[ "$trivy_version" != "0.74.0" ]]; then
            echo "::error::immutable registry scan requires Trivy 0.74.0; found ${trivy_version:-unknown}"
            exit 1
          fi
          evidence_dir="$RUNNER_TEMP/deployment-evidence"
          scan_count=0
          while IFS=$'\t' read -r image repository digest _sbom_name; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::refusing to scan malformed immutable digest for ${image}"
              exit 1
            fi
            scan_output="${evidence_dir}/${image}-trivy.json"
            if [[ -e "$scan_output" || -L "$scan_output" ]]; then
              echo "::error::refusing to overwrite immutable-image scan evidence for ${image}"
              exit 1
            fi
            echo "Scanning ${image} at exact immutable digest ${digest}"
            trivy image \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format json \
              --output "$scan_output" \
              "${repository}@${digest}"
            test -s "$scan_output"
            chmod 600 "$scan_output"
            scan_count=$((scan_count + 1))
          done < "$RUNNER_TEMP/supply-chain/images.tsv"
          if [[ "$scan_count" -ne 5 ]]; then
            echo "::error::immutable registry scan did not cover all five release images"
            exit 1
          fi
          checksum_output="$evidence_dir/immutable-image-trivy.sha256"
          if [[ -e "$checksum_output" || -L "$checksum_output" ]]; then
            echo "::error::refusing to overwrite immutable-image scan checksums"
            exit 1
          fi
          (
            cd "$evidence_dir"
            umask 077
            sha256sum ./*-trivy.json > "$checksum_output"
          )
      - name: Generate deterministic SPDX evidence for every image
