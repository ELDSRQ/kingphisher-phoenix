          -var-file="$RUNNER_TEMP/reviewed.auto.tfvars.json"
          -var="environment=$DEPLOYMENT_ENVIRONMENT"
          -var="network_mode=$DEPLOYMENT_NETWORK_MODE"
          -var="deploy_workloads=true"
          -var="acs_deployment_stage=workloads"
          -var="enable_acs_event_subscription=true"
          -var="operator_image=$IMAGE_REGISTRY/operator-api@$OPERATOR_API_DIGEST"
          -var="tracking_image=$IMAGE_REGISTRY/tracking-api@$TRACKING_API_DIGEST"
          -var="worker_image=$IMAGE_REGISTRY/worker@$WORKER_DIGEST"
          -var="migration_image=$IMAGE_REGISTRY/migration@$MIGRATION_DIGEST"
      - name: Refuse unrelated changes in receipt activation plan
        if: inputs.deployment_phase == 'workloads'
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["terraform", "show", "-json", "acs-receipts.tfplan"],
              check=True,
              capture_output=True,
              text=True,
          )
          plan = json.loads(result.stdout)
          destructive = sorted(
              change["address"]
              for change in plan.get("resource_changes", [])
              if "delete" in change.get("change", {}).get("actions", [])
          )
          if destructive:
              raise SystemExit("receipt activation plan refuses deletes or replacements")
          changed = {
              change["address"]
              for change in plan.get("resource_changes", [])
              if change.get("change", {}).get("actions") != ["no-op"]
          }
          allowed = {"azurerm_eventgrid_system_topic_event_subscription.acs_delivery[0]"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"receipt activation plan contains unrelated changes: {sorted(unexpected)}")
          if changed != allowed:
              raise SystemExit("receipt activation plan did not contain exactly the Event Grid subscription")
          PY
      - name: Checkpoint non-destructive receipt plan
        if: inputs.deployment_phase == 'workloads'
        run: python3 "$KP_CHECKPOINT_HELPER" --stage receipt_plan_safe --status passed
      - name: Activate ACS receipt subscription after readiness
        if: inputs.deployment_phase == 'workloads'
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve acs-receipts.tfplan
      - name: Verify ACS Event Grid subscription
        if: inputs.deployment_phase == 'workloads'
        working-directory: infrastructure/terraform
        shell: bash
        run: |
          set -euo pipefail
          resource_group="$(terraform output -raw resource_group_name)"
          system_topic="$(terraform output -json acs_receipt_ingress | python3 -c 'import json,sys; print(json.load(sys.stdin)["system_topic"])')"
          subscription_name="$(terraform output -json acs_receipt_ingress | python3 -c 'import json,sys; print(json.load(sys.stdin)["subscription_name"])')"
          state="$(az eventgrid system-topic event-subscription show \
            --resource-group "$resource_group" \
            --system-topic-name "$system_topic" \
            --name "$subscription_name" \
            --query provisioningState -o tsv)"
          test "$state" = "Succeeded"
      - name: Checkpoint verified receipt activation
        if: inputs.deployment_phase == 'workloads'
        run: python3 "$KP_CHECKPOINT_HELPER" --stage receipts_activated --status passed
      - name: Emit conclusive ACS stage result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import UTC, datetime
          from pathlib import Path

          def fail(message):
              raise SystemExit(message)

          def read_bound_evidence(filename, expected_digest, expected_schema):
              path = Path(os.environ["RUNNER_TEMP"]) / "deployment-evidence" / filename
              if not path.is_file() or path.stat().st_size > 32_768:
                  fail(f"required {expected_schema} evidence is missing or exceeds the fixed limit")
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, TypeError, ValueError):
                  fail(f"required {expected_schema} evidence is malformed")
              if not isinstance(value, dict) or value.get("schema") != expected_schema:
                  fail(f"required {expected_schema} evidence is malformed")
              supplied = value.pop("evidence_digest", None)
              canonical = json.dumps(value, separators=(",", ":"), sort_keys=True)
              calculated = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
              if supplied != calculated or supplied != expected_digest:
                  fail(f"required {expected_schema} evidence integrity validation failed")
              value["evidence_digest"] = supplied
              if value.get("reviewed_commit_sha") != os.environ["REVIEWED_COMMIT_SHA"]:
                  fail(f"required {expected_schema} evidence source binding changed")
              if value.get("reviewed_deployment_digest") != os.environ["KP_REVIEWED_DEPLOYMENT_DIGEST"]:
                  fail(f"required {expected_schema} evidence configuration binding changed")
              return value

          phase = os.environ.get("DEPLOYMENT_PHASE", "")
          if phase not in {"foundation_bootstrap", "foundation_finalize", "workloads"}:
              fail("ACS stage result phase is invalid")
          live_digest = os.environ.get("KP_ACS_LIVE_READINESS_DIGEST", "")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", live_digest) is None:
              fail("ACS live-readiness digest is missing or malformed")
          live = read_bound_evidence("acs-live-readiness.json", live_digest, "kp.acs-live-readiness.v1")
          if live.get("phase") != phase:
              fail("ACS live-readiness phase binding changed")

          source_digests = {"acs_live_readiness": live_digest}
          claims = {
              "domain_verification_proven": False,
              "association_proven": False,
              "sender_proven": False,
              "workloads_deployed": False,
              "receipt_subscription_activated": False,
              "mail_delivery_proven": False,
              "inbox_placement_proven": False,
              "human_mailbox_validation_proven": False,
          }
          if phase == "foundation_bootstrap":
              initiation_digest = os.environ.get("KP_ACS_VERIFICATION_INITIATION_DIGEST", "")
              if re.fullmatch(r"sha256:[0-9a-f]{64}", initiation_digest) is None:
                  fail("ACS verification-initiation digest is missing or malformed")
              initiation = read_bound_evidence(
                  "acs-verification-initiation.json",
                  initiation_digest,
                  "kp.acs-verification-initiation.v1",
              )
              if initiation.get("phase") != phase:
                  fail("ACS verification-initiation phase binding changed")
              initiation_result = initiation.get("result")
              if initiation_result == "accepted_pending_control_plane_verification":
                  if initiation.get("verification_types") != ["Domain", "SPF", "DKIM", "DKIM2"]:
                      fail("foundation bootstrap did not initiate the exact verification allowlist")
                  result = "foundation_bootstrap_pending_dns"
              elif initiation_result == "already_verified_by_authenticated_readback_no_mutation":
                  if initiation.get("verification_types") != []:
                      fail("already-verified bootstrap evidence unexpectedly records mutations")
                  result = "foundation_bootstrap_already_verified_no_mutation"
                  claims["domain_verification_proven"] = True
              elif initiation_result == "not_applicable_existing_resource_no_mutation":
                  if initiation.get("verification_types") != []:
                      fail("existing-resource bootstrap evidence unexpectedly records mutations")
                  result = "foundation_bootstrap_existing_resource_no_mutation"
              else:
                  fail("ACS verification-initiation result is not conclusive")
              source_digests["acs_verification_initiation"] = initiation_digest
          elif phase == "foundation_finalize":
              finalize_digest = os.environ.get("KP_ACS_FINALIZE_READBACK_DIGEST", "")
              if re.fullmatch(r"sha256:[0-9a-f]{64}", finalize_digest) is None:
                  fail("ACS finalize-readback digest is missing or malformed")
              finalized = read_bound_evidence(
                  "acs-finalize-readback.json",
                  finalize_digest,
                  "kp.acs-finalize-readback.v1",
              )
              if finalized.get("phase") != phase or finalized.get("result") != "foundation_finalized":
                  fail("ACS finalize readback is not conclusive")
              result = "foundation_finalized"
              claims.update({
                  "domain_verification_proven": True,
                  "association_proven": True,
                  "sender_proven": True,
              })
              source_digests["acs_finalize_readback"] = finalize_digest
          else:
              if live.get("result") != "workloads_verified":
                  fail("workloads require conclusive exact ACS live-readiness evidence")
              result = "workloads_deployed"
              claims.update({
                  "domain_verification_proven": True,
                  "association_proven": True,
                  "sender_proven": True,
                  "workloads_deployed": True,
                  "receipt_subscription_activated": True,
              })

          evidence = {
              "schema": "kp.acs-stage-result.v1",
              "recorded_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "result": result,
              "phase": phase,
              "reviewed_commit_sha": os.environ["REVIEWED_COMMIT_SHA"],
              "reviewed_deployment_digest": os.environ["KP_REVIEWED_DEPLOYMENT_DIGEST"],
              "deployment_request_id": os.environ["DEPLOYMENT_REQUEST_ID"],
              "source_evidence_digests": source_digests,
              "workflow_run": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "claims": claims,
          }
          canonical = json.dumps(evidence, separators=(",", ":"), sort_keys=True)
          if len(canonical.encode("utf-8")) > 16_384:
              fail("ACS stage result evidence exceeds the fixed limit")
          digest = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          evidence["evidence_digest"] = digest
          target = Path(os.environ["RUNNER_TEMP"]) / "deployment-evidence" / "acs-stage-result.json"
          with target.open("x", encoding="utf-8") as output:
              output.write(json.dumps(evidence, separators=(",", ":"), sort_keys=True) + "\n")
              output.flush()
              os.fsync(output.fileno())
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as github_environment:
              github_environment.write(f"KP_ACS_STAGE_RESULT_DIGEST={digest}\n")
          PY
      - name: Checkpoint conclusive ACS stage result
        if: success()
        run: python3 "$KP_CHECKPOINT_HELPER" --stage acs_stage_result_recorded --status passed
      - name: Remove ephemeral registry credentials
        if: always() && inputs.deployment_phase == 'workloads'
        shell: bash
        run: |
          set -euo pipefail
          expected_config="$RUNNER_TEMP/docker-config"
          rm -f "$expected_config/config.json"
          rmdir "$expected_config" 2>/dev/null || true
      - name: Summarize
        if: always()
        env:
          CURRENT_JOB_STATUS: ${{ job.status }}
          RELEASE_IMAGE_TAG: ${{ steps.images.outputs.tag }}
        shell: bash
        run: |
          {
            echo "### KingPhisher-Phoenix deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | $DEPLOYMENT_ENVIRONMENT |"
            echo "| Network mode | $DEPLOYMENT_NETWORK_MODE |"
            echo "| Phase | $DEPLOYMENT_PHASE |"
            if [ "$CURRENT_JOB_STATUS" != "success" ]; then
              echo "| Result | Interrupted; reconcile the correlation checkpoint before any retry |"
            elif [ "$DEPLOYMENT_PHASE" = "foundation_bootstrap" ]; then
              echo "| Result | ACS bootstrap recorded; DNS verification remains pending until foundation_finalize |"
            elif [ "$DEPLOYMENT_PHASE" = "foundation_finalize" ]; then
              echo "| Result | ACS foundation finalized by exact post-apply association and sender readback |"
            else
              echo "| ACS authenticated delivery receipts | activated after migration and audit/readiness qualification |"
              echo "| Image tag | $RELEASE_IMAGE_TAG (deployment digest-pinned after SBOM/provenance verification) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOYMENT_NETWORK_MODE" = "starter" ]; then
            echo "> Starter mode: data-plane services are publicly reachable. Re-deploy with network_mode=private before holding real recipient data." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record completed cloud operations
        if: success()
        run: python3 "$KP_CHECKPOINT_HELPER" --stage cloud_operations_complete --status passed
      - name: Preserve interrupted cloud operation checkpoint
        if: always() && job.status != 'success'
        shell: bash
        run: |
          if [[ ! -f "${KP_CHECKPOINT_HELPER:-}" ]]; then
            echo "::error::checkpoint helper was not initialized; automatic retry is blocked"
            exit 1
          fi
          python3 "$KP_CHECKPOINT_HELPER" --stage workflow_interrupted --status uncertain
      - name: Upload append-only deployment recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-evidence/
          if-no-files-found: error
          retention-days: 90
