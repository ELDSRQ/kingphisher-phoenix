# Reconcile terraform state with Azure reality after an interrupted idle apply.
#
# WHY THIS EXISTS
#   An idle apply was interrupted mid-flight: some resources were created in
#   Azure (ACR, ACR private endpoint, 5 AcrPull role assignments) or survived
#   (Enterprise Redis), while the terraform state entries for them were removed
#   by earlier recovery attempts. Terraform then plans to CREATE resources that
#   already exist and fails with "already exists ... needs to be imported".
#
# WHAT IT DOES
#   Reality-driven: for each affected resource, if it EXISTS in Azure but is
#   absent from state, IMPORT it. Nothing is removed from state here and no
#   Azure resource is created, changed or destroyed by this workflow.
#
#   Redis is deliberately NOT imported: it was orphaned in Azure by an
#   interrupted destroy (its private endpoint, its Key Vault secret and its
#   state entries are already gone). Importing it is impossible anyway — with
#   deploy_data_plane=true the locals reference the destroyed redis-url secret
#   and every terraform command fails with "Invalid index" — so it is removed
#   out-of-band with `az resource delete` before this workflow runs, which is
#   exactly what the approved idle plan intended for it. The next workloads
#   deploy recreates Redis, its secret and its private endpoint cleanly.
#
#   The imports need the same 13 no-default variables every plan needs, so this
#   workflow generates a var-file from the reviewed CONFIG line in
#   scripts/operator/deployment-preflight/dispatch-staging-workloads.sh using
#   the same deterministic transforms as azure-idle.sh (integer coercion for the
#   ACS pacing values, graph/reported-mailbox endpoint pops). The live ACS
#   readback is intentionally NOT replicated: imported state is authoritative
#   for attributes, and the verification plan below uses azure-idle.sh, which
#   does the full readback itself.
#
# USAGE
#   az vm start -g rg-kp-staging -n vm-kp-staging-runner
#   gh workflow run azure-tf-state-fix.yml --ref main
#   # approve the staging environment review, read the verification plan, then
#   # dispatch azure-idle.yml mode=apply confirm=IDLE to finish the idle.

name: Fix terraform state drift

on:
  workflow_dispatch:

permissions:
  contents: read

# Deliberately the SAME group azure-deploy.yml and azure-idle.yml use, so state
# surgery can never interleave with a deployment or an idle apply.
concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  fix-state:
    name: Reconcile state on VNet runner
    environment: staging
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ fromJSON('["self-hosted","linux","azure-vnet"]') }}
    timeout-minutes: 30
    env:
      KP_RG: rg-kp-staging
      KP_NETWORK_MODE: private
      KP_INSIDE_VNET: "1"
      # Keep the runner VM in the verification plan, exactly like azure-idle.yml
      # does: idle.tfvars pins deploy_ci_runner=false, and without this override
      # the plan would propose destroying the VM the job is running on.
      KP_KEEP_CI_RUNNER: "1"
      KP_TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      KP_TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      KP_TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # main.tf validates that deploy_ci_runner=true is accompanied by a
      # non-empty registration token; the import below passes that flag.
      TF_VAR_ci_runner_registration_token: ${{ secrets.CI_RUNNER_REGISTRATION_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Initialize terraform
        shell: bash
        run: |
          cd infrastructure/terraform
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=staging/kingphisher.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Reconcile state with Azure reality
        shell: bash
        run: |
          cd infrastructure/terraform
          SUB="${ARM_SUBSCRIPTION_ID}"
          RG="${KP_RG}"

          echo "=== Azure reality (control-plane inventory) ==="
          az resource list -g "$RG" --query "[].name" -o tsv | sort

          echo ""
          echo "=== State before ==="
          terraform state list

          # Var-file from the reviewed CONFIG, with the same transforms
          # azure-idle.sh applies. Secret-free by construction (the dispatch
          # script is committed).
          python3 - <<'PYEOF'
          import json, re
          src = open("../../scripts/operator/deployment-preflight/dispatch-staging-workloads.sh", encoding="utf-8").read()
          m = re.search(r"^CONFIG='(\{.*\})'$", src, re.MULTILINE)
          if m is None:
              raise SystemExit("no CONFIG line found in the dispatch script")
          cfg = json.loads(m.group(1))
          for k in ("acs_daily_message_limit", "acs_messages_per_minute",
                    "acs_ramp_batch_size", "acs_ramp_interval_seconds"):
              cfg[k] = int(cfg[k])
          cfg["graph_endpoint"] = "https://graph.microsoft.com/v1.0" if cfg.pop("enable_directory_sync", "false") == "true" else ""
          cfg["reported_mailbox_endpoint"] = "https://graph.microsoft.com/v1.0" if cfg.pop("enable_reported_mailbox", "false") == "true" else ""
          with open(".state-fix.tfvars.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, separators=(",", ":"), sort_keys=True)
          PYEOF

          # deploy_data_plane=false: the 2026-09-07 fix made this posture
          # evaluable (no redis-url secret reference anywhere), which is what
          # imports need. Redis itself is NOT imported — it was orphaned by an
          # interrupted destroy and is removed out-of-band; the idle posture
          # wants it gone anyway, and the next workloads deploy recreates it.
          COMMON_ARGS=(
            -input=false
            -var-file=environments/staging.tfvars
            -var-file=.state-fix.tfvars.json
            -var=environment=staging
            -var=network_mode=private
            -var=acs_deployment_stage=workloads
            -var=deploy_workloads=false
            -var=deploy_acr=true
            -var=deploy_data_plane=false
            -var=deploy_ci_runner=true
          )

          import_arm() {
            local address="$1" resource_id="$2"
            if terraform state list | grep -qxF "$address"; then
              echo "   already in state: $address"
              return 0
            fi
            if ! az resource show --ids "$resource_id" >/dev/null 2>&1; then
              echo "   absent in Azure, skipping: $address"
              return 0
            fi
            echo "   importing: $address"
            terraform import "${COMMON_ARGS[@]}" "$address" "$resource_id" \
              || { echo "   !! IMPORT FAILED: $address"; FAILED_IMPORTS=1; }
          }
          FAILED_IMPORTS=0

          echo ""
          echo "=== Importing resources that exist in Azure ==="
          import_arm 'azurerm_linux_virtual_machine.ci_runner[0]' \
            "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Compute/virtualMachines/vm-kp-staging-runner"
          import_arm 'azurerm_container_registry.main[0]' \
            "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ContainerRegistry/registries/acrkpstaging"
          import_arm 'azurerm_private_endpoint.acr[0]' \
            "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Network/privateEndpoints/pep-kp-staging-acr"

          # AcrPull role assignments are not ARM `az resource show` resources;
          # existence is proven by discovery. Match each workload identity to
          # its assignment on the registry scope, then import by assignment ID.
          ACR_ID="/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ContainerRegistry/registries/acrkpstaging"
          for key in operator tracking worker migration ai-gateway; do
            address="azurerm_role_assignment.acr_pull[\"$key\"]"
            if terraform state list | grep -qxF "$address"; then
              echo "   already in state: $address"
              continue
            fi
            principal="$(az identity show -n "id-kp-staging-$key" -g "$RG" --query principalId -o tsv 2>/dev/null || true)"
            if [ -z "$principal" ]; then
              echo "   !! identity not found: id-kp-staging-$key"
              FAILED_IMPORTS=1
              continue
            fi
            ra_id="$(az role assignment list --scope "$ACR_ID" --role AcrPull \
              --query "[?principalId=='$principal'].id" -o tsv 2>/dev/null | head -1)"
            if [ -z "$ra_id" ]; then
              echo "   !! no AcrPull assignment found for id-kp-staging-$key"
              FAILED_IMPORTS=1
              continue
            fi
            echo "   importing: $address"
            terraform import "${COMMON_ARGS[@]}" "$address" "$ra_id" \
              || { echo "   !! IMPORT FAILED: $address"; FAILED_IMPORTS=1; }
          done

          rm -f .state-fix.tfvars.json

          echo ""
          echo "=== State after ==="
          terraform state list

          if [ "$FAILED_IMPORTS" != "0" ]; then
            echo "::error::one or more imports failed — see the !! lines above."
            exit 1
          fi

      - name: Verify idle plan
        shell: bash
        run: |
          echo "=== Verifying idle plan (expect: create 0, destroy Redis only, guard OK) ==="
          scripts/operator/azure-idle.sh plan-idle
