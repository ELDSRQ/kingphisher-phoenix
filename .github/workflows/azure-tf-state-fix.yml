# Fix terraform state drift — remove resources that were destroyed outside terraform.
#
# WHY THIS EXISTS
#   When idle.tfvars is applied, it destroys resources (ACR, Redis, etc.).
#   If the state isn't updated properly, terraform thinks those resources still exist
#   and fails when trying to create resources that depend on them.
#
# USAGE
#   gh workflow run azure-tf-state-fix.yml --ref main

name: Fix terraform state drift

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-staging
  cancel-in-progress: false

jobs:
  fix-state:
    name: Fix terraform state on VNet runner
    environment: staging
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ fromJSON('["self-hosted","linux","azure-vnet"]') }}
    timeout-minutes: 30
    env:
      KP_RG: rg-kp-staging
      KP_NETWORK_MODE: private
      KP_INSIDE_VNET: "1"
      KP_TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      KP_TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      KP_TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Initialize terraform
        shell: bash
        run: |
          cd infrastructure/terraform
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=staging/kingphisher.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: List current state
        shell: bash
        run: |
          cd infrastructure/terraform
          echo "=== Current terraform state ==="
          terraform state list

      - name: Sync state with reality
        shell: bash
        run: |
          cd infrastructure/terraform
          echo "=== Current state ==="
          terraform state list

          echo ""
          echo "=== Removing stale resources from state ==="
          terraform state rm azurerm_container_registry.main[0] 2>/dev/null || true
          terraform state rm azurerm_private_endpoint.acr[0] 2>/dev/null || true
          terraform state rm azurerm_role_assignment.acr_pull 2>/dev/null || true
          terraform state rm azurerm_private_endpoint.redis[0] 2>/dev/null || true
          terraform state rm azurerm_role_definition.acs_email_sender[0] 2>/dev/null || true
          terraform state rm azurerm_managed_redis.main[0] 2>/dev/null || true
          terraform state rm azurerm_key_vault_secret.runtime["redis-url"] 2>/dev/null || true
          terraform state rm azurerm_linux_virtual_machine.ci_runner[0] 2>/dev/null || true

          echo ""
          echo "=== State after rm ==="
          terraform state list

          echo ""
          echo "=== Importing CI runner VM back into state ==="
          terraform import -input=false azurerm_linux_virtual_machine.ci_runner[0] \
            "/subscriptions/169644fd-c81d-4935-af55-5770f8271022/resourceGroups/rg-kp-staging/providers/Microsoft.Compute/virtualMachines/vm-kp-staging-runner" 2>&1 || true

          echo ""
          echo "=== State after import ==="
          terraform state list

      - name: Verify idle plan
        shell: bash
        run: |
          echo "=== Verifying idle plan ==="
          scripts/operator/azure-idle.sh plan-idle
