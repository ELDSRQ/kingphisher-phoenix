[project]
name = "kp-tracking-api"
version = "0.1.0"
description = "Tracking API: stateless pixel/click endpoints that record sanitized events"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "cryptography>=42.0",
    "kp-domain-models",
    "kp-database",
    "kp-telemetry",
    "kp-contracts",
]

[project.scripts]
kp-tracking-api = "kp_tracking_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_tracking_api"]
