[project]
name = "kp-operator-api"
version = "0.1.0"
description = "Operator API: campaign lifecycle, sources, recipients, approvals, audit"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "redis>=5.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "kp-domain-models",
    "kp-database",
    "kp-authorization",
    "kp-telemetry",
    "kp-auditing",
    "kp-contracts",
    "kp-campaign-patterns",
    "kp-templating",
    "kp-safety-validation",
    "kp-domain-verification",
]

[project.scripts]
kp-operator-api = "kp_operator_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kp_operator_api"]
