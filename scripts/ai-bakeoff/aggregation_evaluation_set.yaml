# Aggregation-quality evaluation set (M3 background analyst tier).
#
# Fictional and sanitized: every actor, sector, and reference below is invented;
# no real recipient, mailbox, or organization appears anywhere. Unlike
# evaluation_set.yaml (which scores GENERATION quality), this set scores
# AGGREGATION/ANALYSIS quality: given a batch of already-ingested, neutralized
# feed items, can the analyst model pick the OPTIMAL current campaign material
# and rank it first.
#
# Each case is a list of feed items plus `gold_item_ids` — the input items that
# ARE the optimal current campaign. The scorer is deterministic: it checks that
# the model's rank-1 candidate is sourced from (intersects) the gold items.
# A candidate derived from a non-gold item, or a stale/irrelevant item promoted
# above the gold, is a miss.
#
# This set is paired with aggregate_evaluate.py. Changes to the set must be
# reviewed and recorded here (like evaluation_set.yaml's version discipline).

set_version: "1.0"
cases:
  - id: recency_currency
    kind: ranking
    gold_item_ids: ["feed-2026-0417-a"]
    items:
      - item_id: feed-2026-0417-a
        title: "Urgent invoice wave targeting EMEA logistics this week"
        excerpt: "A fresh campaign surfaced yesterday: attackers impersonating a regional carrier send 'overdue invoice' lures with a 24-hour payment demand. The sender domain was registered three days ago and the lure embeds a working credential-phishing form."
        published_at: "2026-09-17"
        source_reference: "REV-2026-9010"
        claimed_actor: "Midnight Basilisk"
        claimed_target_sector: "European logistics"
      - item_id: feed-2026-0201-b
        title: "Old gift-card scam from Q1"
        excerpt: "A months-old gift-card redemption scam that mostly targeted consumer mailboxes. No new infrastructure or activity has been observed since March."
