# Drop-in for the kp-ai-gateway systemd unit on a self-hosted (llama.cpp/Ollama)
# deployment. Install at:
#   /etc/systemd/system/kp-ai-gateway.service.d/override.conf
# then: systemctl daemon-reload && systemctl restart kp-ai-gateway
#
# The gateway's env is set INLINE in the root-owned unit (not .env), so these go
# in a root drop-in. On .105 the edit is done via `wsl -u root` (no password).
#
# Why these two:
#  * RESPONSE_FORMAT_MODE=json_object — llama.cpp/Ollama cannot compile the
#    OpenAI strict json_schema grammar carrying string length bounds; it returns
#    400 "failed to parse grammar" (surfaced as 502). json_object asks for valid
#    JSON only; the prompt already fixes the fields. (PR adding this: #120.)
#  * SEND_TEMPERATURE=false — the gateway default temperature=0 drives abliterated
#    models into a runaway, never-terminating generation; omitting temperature
#    lets them finish cleanly.
[Service]
Environment=KP_AI_GATEWAY_RESPONSE_FORMAT_MODE=json_object
Environment=KP_AI_GATEWAY_SEND_TEMPERATURE=false
