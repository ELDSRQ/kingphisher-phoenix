services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kingphisher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kingphisher
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:?set AUDIT_WRITER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/containers/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingphisher -d kingphisher"]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  redis:
    image: redis:7-alpine
    user: "999:999"
    # Queue durability: Redis backs the at-least-once job queue (deliver/generate/
    # retention messages + delayed zset + processing list). AOF (default
    # appendfsync everysec) + default RDB saves on the redis_data volume keep
    # queued jobs from being lost on restart.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      # Persist /data (AOF/RDB) so queued jobs survive a Redis restart.
      - redis_data:/data
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mailpit:
    image: axllent/mailpit:v1.20
    environment:
      MP_API_PASSWORD: ${MAILPIT_API_PASSWORD:?set MAILPIT_API_PASSWORD in .env}
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP relay used by the delivery worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config", "/etc/otel-collector.yaml"]
    volumes:
      - ./infrastructure/containers/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mock-idp:
    build:
      context: ./infrastructure/mock-services
    command: ["python", "-m", "uvicorn", "mock_idp:app", "--host", "0.0.0.0", "--port", "8443"]
    ports:
      - "127.0.0.1:8443:8443"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mock-graph:
    build:
      context: ./infrastructure/mock-services
    command: ["python", "-m", "uvicorn", "mock_graph:app", "--host", "0.0.0.0", "--port", "8181"]
    ports:
      - "127.0.0.1:8181:8181"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mock-ai:
    build:
      context: ./infrastructure/mock-services
    command: ["python", "-m", "uvicorn", "mock_ai:app", "--host", "0.0.0.0", "--port", "8282"]
    ports:
      - "127.0.0.1:8282:8282"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

volumes:
  postgres_data:
  redis_data:
