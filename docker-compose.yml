name: phishing-awareness-platform

# Required before any pull, create, or recreate that can replace a stateful
# service image. The command is read by launch/deployment tooling and is also
# safe to run directly; it never mutates Compose resources or named volumes.
x-kp-base-image-qualification:
  command: ["bash", "scripts/operator/base-image-qualification/run.sh"]
  stateful_services: ["postgres", "redis"]

services:
  postgres:
    # Keep the last locally qualified multi-architecture index. The newer
    # 16.15 index published zero-byte account data in its ARM64 image and
    # fails before PostgreSQL can reach the preserved data volume.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: kingphisher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kingphisher
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:?set AUDIT_WRITER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/containers/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingphisher -d kingphisher"]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  redis:
    # Keep the last locally qualified multi-architecture index. The newer
    # 7.4.11 ARM64 image published an empty entrypoint and cannot start.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    user: "999:999"
    # Queue durability: Redis backs the at-least-once job queue (deliver/generate/
    # retention messages + delayed zset + processing list). AOF (default
    # appendfsync everysec) + default RDB saves on the redis_data volume keep
    # queued jobs from being lost on restart.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      # Persist /data (AOF/RDB) so queued jobs survive a Redis restart.
      - redis_data:/data
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mailpit:
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    environment:
      MP_API_PASSWORD: ${MAILPIT_API_PASSWORD:?set MAILPIT_API_PASSWORD in .env}
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP relay used by the delivery worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0@sha256:b65527791431d76d058b2813748a3f4a8912540d7b23beac2f6b4e02c872f5b7
    command: ["--config", "/etc/otel-collector.yaml"]
    volumes:
      - ./infrastructure/containers/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mock-idp:
    build:
      context: ./infrastructure/mock-services
    command: ["python", "-m", "uvicorn", "mock_idp:app", "--host", "0.0.0.0", "--port", "8443"]
    ports:
      - "127.0.0.1:8443:8443"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mock-graph:
    build:
      context: ./infrastructure/mock-services
    command: ["python", "-m", "uvicorn", "mock_graph:app", "--host", "0.0.0.0", "--port", "8181"]
    ports:
      - "127.0.0.1:8181:8181"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  mock-ai:
    build:
      context: ./infrastructure/mock-services
    command: ["python", "-m", "uvicorn", "mock_ai:app", "--host", "0.0.0.0", "--port", "8282"]
    ports:
      - "127.0.0.1:8282:8282"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

  # Internal Qwen generation gateway (kp-ai-gateway). Behind the "ai" profile so
  # the default `docker compose up` (infra + mocks) is unchanged; start it with
  # `docker compose --profile ai up ai-gateway`. It proxies to the operator-run,
  # pinned llama.cpp Qwen2.5-7B server named by KP_AI_GATEWAY_LLAMA_BASE_URL.
  # From inside the container, reach a llama.cpp server running on the host via
  # host.docker.internal, e.g. KP_AI_GATEWAY_LLAMA_BASE_URL=http://host.docker.internal:18081/v1.
  # Point the apps at it with KP_WORKER_AI_BASE_URL=http://127.0.0.1:8090 to use
  # real Qwen instead of the mock-ai stand-in.
  ai-gateway:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: infrastructure/containers/Dockerfile.ai-gateway
    environment:
      KP_AI_GATEWAY_HOST: "0.0.0.0"
      KP_AI_GATEWAY_PORT: "8090"
      # Defaulted (not required) so a plain `docker compose up` never fails
      # interpolation for this inactive-by-default service. For the containerized
      # gateway, reach a host llama.cpp via host.docker.internal; override in .env
      # if your pinned llama.cpp server is elsewhere.
      KP_AI_GATEWAY_LLAMA_BASE_URL: ${KP_AI_GATEWAY_LLAMA_BASE_URL:-http://host.docker.internal:18081/v1}
      KP_AI_GATEWAY_MODEL_ID: ${KP_AI_GATEWAY_MODEL_ID:-llama.cpp/Qwen2.5-7B-Instruct-Q4_K_M}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    pids_limit: 128

volumes:
  postgres_data:
    name: phishing-awareness-platform_postgres_data
  redis_data:
    name: phishing-awareness-platform_redis_data
